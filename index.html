function bindOralBtns(){
  if(ORAL._bound)return;
  ORAL._bound=true;
  $('#oralExit').onclick=exitOral;
  $('#oralNewQ').onclick=()=>{
    if(ORAL.log.length&&!confirm('換題會清空目前對話記錄，確定？'))return;
    if(ORAL.mode==='p2p'){
      ORAL.q=ORAL_GROUP[Math.floor(Math.random()*ORAL_GROUP.length)];
      ORAL.log=[];ORAL.buf='';renderOralQ();renderOralLog();return;
    }
    /* 開啟題庫瀏覽器，可選年份／主題；直接關閉則隨機抽題 */
    BANK_F.mode=(ORAL.mode==='indiv'?'indiv':'group');
    const fromRoom=false;
    openOralBank();
    /* 若使用者直接關閉視窗而沒選題，維持原題目 */
  };
  $('#oralSettings').onclick=()=>openSettings();
  $('#oralExport').onclick=exportOral;
  const rb=$('#oralRec');
  rb.onclick=async()=>{
    if(ORAL.phase==='prep'){if(confirm('仍在準備階段，直接開始作答？'))setPhase('speak');else return}
    if(!ORAL.recOn){
      if(!startRecog())return;
      rb.classList.remove('off');rb.classList.add('on');rb.textContent='⏹';
      $('#oralHint').textContent='錄音中… 說完後按一次結束這段發言';
    }else{
      const dur=Math.max(1,Math.round((ORAL.buf.split(/\s+/).filter(Boolean).length)/2.2));
      stopRecog();
      rb.classList.add('off');rb.classList.remove('on');rb.textContent='🎤';
      const txt=ORAL.buf.trim();
      ORAL.buf='';
      if(txt){
        ORAL.log.push({who:'me',name:DB.set.roleName||'我',color:'#2563eb',
          text:txt,t:ORAL.total-ORAL.t,dur});
        renderOralLog();
        if(ORAL.mode==='indiv'&&DB.set.autoAI){
          await aiIndivFollow(txt);
        }
      }else{
        $('#oralHint').textContent='未偵測到語音，請再試一次';
      }
    }
  };
}

/* ── AI 發言 ── */
async function aiTurn(idx){
  if(ORAL.mode!=='group'||ORAL.phase!=='speak')return;
  if(ORAL.aiBusy)return;
  ORAL.aiBusy=true;
  const list=ORAL.roles.filter(r=>r.on);
  if(!list.length){ORAL.aiBusy=false;return}
  const r=list[idx%list.length];
  const text=await genAITurn(r);
  if(ORAL.phase!=='speak'){ORAL.aiBusy=false;return}
  const dur=Math.max(2,Math.round(text.split(/\s+/).length/2.4));
  ORAL.log.push({who:'ai',name:r.name,color:r.color,text,t:ORAL.total-ORAL.t,dur});
  renderOralLog();
  if(ORAL.recOn){stopRecog();$('#oralRec').classList.add('off');$('#oralRec').textContent='🎤'}
  $('#oralHint').textContent=r.name+' 發言中…';
  await speak(text,{voice:r.voice,pitch:r.pitch,rate:r.rate});
  $('#oralHint').textContent='按麥克風繼續發言';
  ORAL.aiBusy=false;
}

function oralContext(){
  const q=ORAL.q;
  const conv=ORAL.log.map(m=>`${m.name}: ${m.text}`).join('\n');
  return {
    stimulus:q.stimulus||q.q,
    question:q.q,
    points:(q.points||[]).join('; '),
    conv
  };
}

async function genAITurn(role){
  const c=oralContext();
  if(DB.set.apiKey){
    const sys=`You are ${role.name}, a Hong Kong secondary school student taking the HKDSE English Language Paper 4 Speaking test, Part A Group Discussion.
Your speaking style: ${role.style}
Rules:
- Speak naturally as a teenager in a group discussion, NOT as a teacher or examiner.
- Keep each turn to 2-4 sentences, about 40-70 words.
- Refer to the topic stimulus and respond to what previous speakers said.
- Use natural discussion phrases: "I see your point, but…", "That's a fair point, and I'd add…", "Would you agree that…?"
- Occasionally ask another candidate a question to keep the discussion going.
- Do NOT use bullet points, stage directions, or quotation marks around your speech.
- Output ONLY the spoken words.`;
    const user=`Topic stimulus: ${c.stimulus}\nDiscussion question: ${c.question}\nPoints to consider: ${c.points}\n\nConversation so far:\n${c.conv||'(no one has spoken yet — you may open the discussion)'}\n\nYour turn (${role.name}):`;
    const r=await aiChat([{role:'system',content:sys},{role:'user',content:user}],{max:180,temp:0.9});
    if(r)return clean(r);
  }
  return localAITurn(role,c);
}

function localAITurn(role,c){
  const openers=[
    `Shall I kick off? I think one key issue here is ${c.points.split(';')[0]}.`,
    `Building on that, I'd say we should also consider ${c.points.split(';')[1]||'the wider impact'}.`,
    `That's a fair point, and I'd add that there's another side to this.`,
    `I see your point, but I'd argue there's a different angle worth exploring.`,
    `Would you agree that this really depends on how we look at it?`
  ];
  const bodies=[
    `From my experience, most students I know would probably feel the same way.`,
    `If you look at the data in the stimulus, it seems to suggest the opposite as well.`,
    `I think the real question is whether the benefits outweigh the drawbacks.`,
    `On balance, I suppose it comes down to personal priorities.`,
    `That said, I can see why some people would take the opposite view.`
  ];
  const ends=[
    `What do you think?`,
    `Does that make sense?`,
    `I'd be interested to hear your view on this.`,
    `Shall we look at another angle?`,
    `So perhaps the answer isn't as simple as it first appears.`
  ];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  if(role.tag.includes('Advocate')&&Math.random()<0.6){
    return pick([`I'm not sure I agree with that. `,`With respect, I think that's only part of the picture. `,
      `Actually, I'd challenge that assumption. `])+pick(bodies)+' '+pick(ends);
  }
  return pick(openers)+' '+pick(bodies)+' '+pick(ends);
}

async function aiIndivFollow(myText){
  if(!DB.set.apiKey)return;
  ORAL.aiBusy=true;
  const q=ORAL.q;
  const sys=`You are an HKDSE English Language Paper 4 Speaking examiner. A candidate has just given a 1-minute Individual Response.
Give ONE brief follow-up question (max 25 words) that pushes the candidate to elaborate, justify or give an example.
Output ONLY the question, no preamble.`;
  const r=await aiChat([{role:'system',content:sys},
    {role:'user',content:`Question: ${q.q}\nCandidate's response: ${myText}`}],{max:60,temp:0.8});
  ORAL.aiBusy=false;
  if(!r)return;
  ORAL.log.push({who:'ai',name:'Examiner',color:'#7c3aed',text:clean(r),t:ORAL.total-ORAL.t,dur:0});
  renderOralLog();
  await speak(clean(r),{voice:'female-en',pitch:1.05,rate:0.98});
}

/* ── 大模型呼叫（OpenAI 相容） ── */
async function aiChat(messages,opt={}){
  const s=DB.set;
  if(!s.apiKey)return null;
  const base=(s.apiBase||'https://api.openai.com/v1').replace(/\/+$/,'');
  const url=/chat\/completions$/.test(base)?base:base+'/chat/completions';
  const model=s.model||(s.apiProvider==='deepseek'?'deepseek-chat':'gpt-4o-mini');
  try{
    const resp=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
      body:JSON.stringify({model,messages,temperature:opt.temp??0.7,max_tokens:opt.max||500})
    });
    if(!resp.ok){const t=await resp.text();console.warn('AI error',resp.status,t);return null}
    const j=await resp.json();
    return j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||null;
  }catch(e){console.warn(e);return null}
}
function clean(t){
  return String(t||'').replace(/^["'\s]+|["'\s]+$/g,'').replace(/\s+/g,' ').trim();
}

/* ── 結束與評分 ── */
async function endOral(){
  clearInterval(ORAL.iv);
  stopRecog();shutup();
  ORAL.phase='done';
  $('#oralPhase').textContent='已結束 · 評分中…';
  const myTurns=ORAL.log.filter(m=>m.who==='me');
  const allText=myTurns.map(m=>m.text).join(' ');
  const words=allText.split(/\s+/).filter(Boolean);
  const n=words.length;
  const spokenSec=myTurns.reduce((a,b)=>a+(b.dur||0),0)||1;
  const wpm=n/(spokenSec/60);

  if(!n){
    $('#oralPhase').textContent='已結束（無語音記錄）';
    alert('未偵測到你的語音記錄，無法評分。');
    return;
  }
  let report;
  if(DB.set.apiKey){
    report=await aiScore(allText)||localScore(allText,n,wpm,myTurns.length);
  }else{
    report=localScore(allText,n,wpm,myTurns.length);
  }
  report.meta={words:n,wpm:Math.round(wpm),turns:myTurns.length,sec:spokenSec,
    mode:ORAL.mode,question:ORAL.q.q,stimulus:ORAL.q.stimulus||'',date:todayStr()};
  showOralReport(report);
  DB.oralHist=DB.oralHist||[];
  DB.oralHist.push({d:Date.now(),rep:report,log:ORAL.log,q:ORAL.q,mode:ORAL.mode});
  save();
}

function fillerCount(t){
  const m=t.toLowerCase().match(/\b(um|uh|er|ah|like|you know|i mean|basically|actually|so yeah)\b/g);
  return m?m.length:0;
}
function ttr(t){
  const w=t.toLowerCase().match(/[a-z']+/g)||[];
  if(!w.length)return 0;
  return new Set(w).size/w.length;
}

function localScore(text,n,wpm,turns){
  const fillers=fillerCount(text);
  const div=ttr(text);
  const sentences=(text.match(/[.!?]+/g)||[]).length||1;
  const avgSent=n/sentences;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  /* 四個維度（DSE Paper 4 準則） */
  const pd=clamp(Math.round(2.5+(wpm>110&&wpm<165?1.3:0)+(fillers<3?0.8:fillers<7?0.2:-0.5)),1,7);
  const cs=clamp(Math.round(2.6+(turns>=3?1.2:turns>=2?0.6:0)+(avgSent>8&&avgSent<24?0.8:0.1)),1,7);
  const vp=clamp(Math.round(2.4+div*3.4+(n>90?0.7:0)+(fillers<5?0.3:0)),1,7);
  const io=clamp(Math.round(2.5+(n>110?0.9:0)+(avgSent>10?0.7:0)+(turns>=2?0.5:0)),1,7);
  const tips=[];
  if(wpm<110)tips.push('語速偏慢（'+Math.round(wpm)+' wpm）。DSE 口試的理想語速約 120–160 wpm，可多作限時朗讀練習。');
  if(wpm>175)tips.push('語速偏快（'+Math.round(wpm)+' wpm），可能影響清晰度。嘗試在子句之間稍作停頓。');
  if(fillers>4)tips.push('填充詞偏多（'+fillers+' 次，如 um / like / you know）。與其用填充詞爭取時間，不如直接說 "Let me think about that for a moment."');
  if(div<0.5)tips.push('詞彙重複度偏高（類型／形符比 '+div.toFixed(2)+'）。嘗試用同義詞替換：important → crucial / significant / vital。');
  if(avgSent<9)tips.push('句子偏短（平均 '+avgSent.toFixed(1)+' 字）。可多用以 because / although / which 連接的複合句。');
  if(turns<2&&ORAL.mode==='group')tips.push('在小組討論中只發言了一次。建議爭取 4–6 次實質發言，並主動回應他人觀點。');
  if(avgSent>26)tips.push('句子偏長，容易在口語中失控。建議把長句拆成兩至三個短句。');
  if(!tips.length)tips.push('整體表現良好。下一步可專注於使用更多話題相關的高階詞彙，以及在討論中主動作總結。');
  return{dims:[
    {n:'Pronunciation & Delivery',s:pd,max:7,c:''},
    {n:'Communication Strategies',s:cs,max:7,c:''},
    {n:'Vocabulary & Language Patterns',s:vp,max:7,c:''},
    {n:'Ideas & Organisation',s:io,max:7,c:''}],
    tips,engine:'browser',summary:''};
}

async function aiScore(text){
  const q=ORAL.q;
  const sys=`You are an experienced HKDSE English Language Paper 4 Speaking examiner. Assess a candidate's spoken performance.

Assessment criteria (each scored 1-7, where 7 is highest):
1. Pronunciation & Delivery — clarity, stress, intonation, fluency, pace
2. Communication Strategies — initiating, maintaining and extending the discussion; turn-taking; responding to others
3. Vocabulary & Language Patterns — range, accuracy, appropriacy of vocabulary and grammatical patterns
4. Ideas & Organisation — relevance, development, elaboration with reasons/examples, coherence

You must reply with STRICT JSON only (no markdown, no code fence):
{"summary":"one sentence overall comment",
 "dims":[{"n":"Pronunciation & Delivery","s":N,"c":"specific comment with an example"},
         {"n":"Communication Strategies","s":N,"c":"..."},
         {"n":"Vocabulary & Language Patterns","s":N,"c":"..."},
         {"n":"Ideas & Organisation","s":N,"c":"..."}],
 "fixes":[{"bad":"exact phrase from the candidate","good":"improved version","why":"brief reason"}],
 "tips":["actionable advice 1","actionable advice 2","actionable advice 3"]}

Rules for "fixes": pick 2-4 real phrases from the candidate's text. Keep "bad" EXACTLY as the candidate wrote it.
Rules for "tips": be specific and actionable, written in English.`;
  const user=`Task: ${q.stimulus||''}\nQuestion: ${q.q}\nMode: ${ORAL.mode==='indiv'?'Individual Response (1 minute)':'Group Discussion (8 minutes)'}\n\nCandidate's spoken text (transcribed):\n"""\n${text}\n"""\n\nAssess now. Reply with JSON only.`;
  const r=await aiChat([{role:'system',content:sys},{role:'user',content:user}],{max:1100,temp:0.3});
  if(!r)return null;
  try{
    let s=r.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
    const j=JSON.parse(s);
    if(!j.dims||!j.dims.length)return null;
    j.engine='ai';
    return j;
  }catch(e){console.warn('score parse fail',r);return null}
}

/* ══════════ P2P 房間碼連線（WebRTC via PeerJS 公共信令） ══════════ */
function initP2P(){
  const box=$('#oralLog');
  $('#oralPrompt').innerHTML=`
    <div class="q">輸入相同的房間碼，即可與好友進行真人語音對練。</div>
    <div class="eqbox" style="margin-top:12px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input class="inp" id="roomIn" placeholder="房間碼（例如 246810）" style="max-width:200px">
        <button class="btn pri" id="roomCreate">建立房間</button>
        <button class="btn" id="roomJoin">加入房間</button>
      </div>
      <div class="ocrbar"><span class="st" id="roomSt">尚未連線。所有參與者須同時在線並使用同一房間碼。</span></div>
    </div>
    <div class="hint" style="margin-top:12px">
      技術說明：採用 WebRTC 點對點傳輸，語音不經伺服器轉發；信令伺服器僅用於建立連線。
      需連上互聯網載入連線元件，若學校網絡封鎖相關連線，請改用「AI 模擬小組討論」模式。
    </div>`;
  $('#oralRoles').innerHTML='<div class="empty">連線後會顯示參與者清單。</div>';
  $('#oralPhase').textContent='P2P 模式';
  $('#oralT').textContent='—';
  const gen=()=>String(Math.floor(100000+Math.random()*900000));
  $('#roomIn').value=gen();
  $('#roomCreate').onclick=()=>joinRoom($('#roomIn').value.trim(),true);
  $('#roomJoin').onclick=()=>joinRoom($('#roomIn').value.trim(),false);
}

function joinRoom(code,isHost){
  if(!/^\d{4,8}$/.test(code)){alert('房間碼須為 4–8 位數字');return}
  ORAL.roomCode=code;ORAL.isHost=isHost;
  const st=$('#roomSt');
  st.textContent='正在載入連線元件…';
  loadPeerJS().then(()=>{
    st.textContent='正在連線…';
    const myId='dseoral-'+code+'-'+(isHost?'host':uid().slice(0,6));
    ORAL.peerId=myId;
    try{ORAL.peer=new Peer(myId)}catch(e){st.textContent='連線失敗：'+e.message;return}
    ORAL.peer.on('open',()=>{
      st.textContent='已連線 · 房間碼 '+code+' · 你的身分：'+(isHost?'房主':'參與者');
      $('#oralRoles').innerHTML=`<div class="role"><div class="rh">
        <span class="av" style="background:var(--pr)">${esc((DB.set.roleName||'我').slice(0,2))}</span>
        <input value="${esc(DB.set.roleName||'我')}" id="myName" placeholder="你的名字"></div>
        <div style="font-size:12px;color:var(--mu);margin-top:6px">
          房間碼 <b>${esc(code)}</b> — 把這組號碼告訴好友即可加入。</div></div>
        <div id="peerList"></div>`;
      const n=$('#myName');if(n)n.onchange=()=>{DB.set.roleName=n.value;save();broadcastName()};
      /* 取得麥克風 */
      navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
        ORAL.myStream=s;
        if(!isHost){
          const c=ORAL.peer.connect('dseoral-'+code+'-host');
          c.on('open',()=>c.send({type:'join',id:myId,name:DB.set.roleName||'我'}));
          c.on('data',d=>handleSignal(d,c));
          ORAL.calls['dseoral-'+code+'-host']=c;
        }
      }).catch(e=>{st.textContent='無法使用麥克風：'+e.message});
      ORAL.peer.on('call',call=>{
        if(!ORAL.myStream){call.close();return}
        call.answer(ORAL.myStream);
        call.on('stream',rs=>addRemote(call.peer,rs));
        ORAL.calls[call.peer]=call;
      });
      ORAL.peer.on('connection',c=>{
        c.on('data',d=>handleSignal(d,c));
        ORAL.calls[c.peer]=c;
      });
      ORAL.peer.on('error',e=>{st.textContent='連線錯誤：'+(e.message||e.type)});
    });
  }).catch(e=>{
    st.textContent='無法載入連線元件（需要互聯網）。請改用「AI 模擬小組討論」模式。';
  });
}
function handleSignal(d,conn){
  if(!d||!d.type)return;
  if(d.type==='join'){
    if(!ORAL.isHost)return;
    const list=Object.keys(ORAL.calls).filter(k=>k.startsWith('dseoral-'+ORAL.roomCode));
    conn.send({type:'members',list,name:DB.set.roleName||'我'});
    Object.keys(ORAL.calls).forEach(k=>{
      if(k===conn.peer)return;
      try{ORAL.calls[k].send({type:'newpeer',id:conn.peer,name:d.name})}catch(e){}
    });
    renderPeers();
  }
  if(d.type==='members'){
    renderPeers(d.list||[]);
    (d.list||[]).forEach(id=>{
      if(id===ORAL.peerId)return;
      callPeer(id);
    });
  }
  if(d.type==='newpeer'){
    renderPeers();
    callPeer(d.id);
  }
  if(d.type==='name'){
    renderPeers();
  }
}
function callPeer(id){
  if(!ORAL.myStream||ORAL.calls[id]&&ORAL.calls[id].open===false)return;
  if(ORAL.calls[id]&&ORAL.calls[id]._isCall)return;
  try{
    const call=ORAL.peer.call(id,ORAL.myStream);
    if(!call)return;
    call._isCall=true;
    call.on('stream',rs=>addRemote(id,rs));
    ORAL.calls[id]=call;
  }catch(e){}
}
function addRemote(id,stream){
  ORAL.remoteStreams[id]=stream;
  let a=document.getElementById('au-'+id);
  if(!a){
    a=document.createElement('audio');
    a.id='au-'+id;a.autoplay=true;
    document.body.appendChild(a);
  }
  a.srcObject=stream;
  renderPeers();
}
function broadcastName(){
  Object.keys(ORAL.calls).forEach(k=>{
    try{ORAL.calls[k].send&&ORAL.calls[k].send({type:'name',name:DB.set.roleName||'我'})}catch(e){}
  });
}
function renderPeers(list){
  const box=document.getElementById('peerList');
  if(!box)return;
  const ids=list||Object.keys(ORAL.remoteStreams);
  box.innerHTML='<div style="font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 6px">參與者</div>'+
    ids.map(id=>`<div class="equ"><span class="dot" style="background:${ORAL.remoteStreams[id]?'#059669':'#cbd2dc'}"></span>
      <span style="font-size:12.5px">${esc(id.replace('dseoral-'+ORAL.roomCode+'-',''))}</span></div>`).join('');
}
function loadPeerJS(){
  return new Promise((res,rej)=>{
    if(window.Peer){res();return}
    const s=document.createElement('script');

    document.head.appendChild(s);

  });
}

   自訂題目編輯器（拍照 / 掃描上傳 / OCR / 圖片 / 文字）

/* ── 圖片壓縮（避免 localStorage 爆掉） ── */
function compressImg(file,maxSide=1400,quality=0.82){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let{w,h}=img;
        const sc=Math.min(1,maxSide/Math.max(w,h));
        w=Math.round(w*sc);h=Math.round(h*sc);
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',quality));
      };
      img.onerror=rej;
      img.src=fr.result;
    };
    fr.onerror=rej;
    fr.readAsDataURL(file);
  });
}

/* ── OCR（Tesseract.js，需聯網載入；失敗則回退手動輸入） ── */
function loadTesseract(){
  return new Promise((res,rej)=>{
    if(window.Tesseract){res();return}
    const s=document.createElement('script');
    s.src='https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js';
    s.onload=()=>window.Tesseract?res():rej(new Error('no tesseract'));
    s.onerror=()=>rej(new Error('load fail'));
    document.head.appendChild(s);
    setTimeout(()=>{if(!window.Tesseract)rej(new Error('timeout'))},20000);
  });
}
async function runOCR(dataUrl,lang,onProg){
  await loadTesseract();
  const {data}=await Tesseract.recognize(dataUrl,lang,{
    logger:m=>{if(onProg&&m.status)onProg(m.status,m.progress||0)}
  });
  return (data&&data.text||'').trim();
}

         若被文字答案覆蓋，自動批改會永遠判錯。 */
      obj.ans=Math.min(Number($('#eAns').value),opts.length-1);

    const a=$('#eA').value.trim(),ex=$('#eE').value.trim();

    if(ex)obj.ex=ex;
    const i=DB.custom.findIndex(x=>x.id===ED.id);
    if(i>=0)DB.custom[i]=obj;else DB.custom.unshift(obj);

    DB.custom=DB.custom.filter(x=>x.id!==ED.id);

      if(confirm('確定清空全部自訂題目？此動作無法復原，建議先匯出備份。')){
        DB.custom=[];save();closeModal();renderQ();
      }
    };
  });
}

/* ══════════ 設定 ══════════ */

    <div class="edrow"><span class="lb">筆試開考日</span>

    <div class="fnote">實際時間表以考評局公布為準。修改後頁面右上方的倒數會即時更新。</div>
  </div>

  <div class="edsec">
    <div class="t">AI 引擎（選填）</div>
    <div class="edrow"><span class="lb">服務供應商</span>
      <select class="sel" id="sP">
        <option value="none" ${s.apiProvider==='none'?'selected':''}>不填 Key — 使用瀏覽器內置模式（免費）</option>
        <option value="deepseek" ${s.apiProvider==='deepseek'?'selected':''}>DeepSeek（deepseek-chat）</option>
        <option value="openai" ${s.apiProvider==='openai'?'selected':''}>OpenAI（gpt-4o-mini）</option>
        <option value="custom" ${s.apiProvider==='custom'?'selected':''}>自訂（OpenAI 相容 API）</option>
      </select></div>
    <div class="edrow"><span class="lb">API Base URL</span>
      <input class="inp" id="sB" value="${esc(s.apiBase)}" placeholder="留空則用供應商預設值"></div>
    <div class="edrow"><span class="lb">模型名稱</span>

    <div class="edrow"><span class="lb">API Key</span>
      <input class="inp" id="sK" type="password" value="${esc(s.apiKey)}" placeholder="sk-…"></div>

      API Key 只儲存在本機瀏覽器（localStorage），不會上傳到任何伺服器，也不會隨備份檔以外的地方傳送。<br>
      填寫後，Oral 練習的 AI 組員會真正理解你說的內容、按 DSE 準則評分並給出句子改寫建議。
      不填也能用：AI 組員會用預設語料庫發言，評分則改用語速、詞彙多樣性等客觀指標推算。
    </div>
  </div>

  <div class="edsec">
    <div class="t">Oral 練習</div>
    <div class="edrow"><span class="lb">我的名字</span>
      <input class="inp" id="sN" value="${esc(s.roleName||'我')}" placeholder="顯示在對話記錄中"></div>
    <div class="edrow"><span class="lb">AI 語音</span>
      <label style="font-size:13.5px;display:flex;gap:7px;align-items:center">
        <input type="checkbox" id="sT" ${s.ttsOn?'checked':''}> 讓 AI 組員發聲（不同角色使用不同音色）</label></div>
    <div class="edrow"><span class="lb">自動接話</span>
      <label style="font-size:13.5px;display:flex;gap:7px;align-items:center">
        <input type="checkbox" id="sA" ${s.autoAI?'checked':''}> 開始討論時由 AI 先開場</label></div>
    <div class="fnote">若聽不到 AI 聲音，請檢查系統音量，並在瀏覽器設定中安裝英文語音套件。</div>
  </div>

  <div class="edsec">
    <div class="t">數據</div>
    <div class="edrow"><span class="lb">備份</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" id="sExp">↓ 匯出全部資料</button>
        <button class="btn sm" id="sImp">↑ 匯入備份</button>
        <button class="btn sm dg" id="sRst">重置全部</button>
        <input type="file" id="sFile" accept=".json" hidden>
      </div></div>
    <div class="fnote">備份包含：知識點進度、自訂題目、學習時間、閃卡、Oral 記錄與設定。</div>

      <b>步驟：</b>① 按上面按鈕下載檔案 ② 開

    custom:{base:'',model:''},
    none:{base:'',model:''}
  };
  $('#sP').onchange=e=>{
    const p=PRESETS[e.target.value];
    if(p&&e.target.value!=='custom'){$('#sB').value=p.base;$('#sM').value=p.model}
  };
  $('#sSave').onclick=()=>{
    DB.set.dseYear=+$('#sY').value;
    DB.set.examDate=$('#sD').value||'2027-04-15';
    DB.set.apiProvider=$('#sP').value;
    DB.set.apiBase=$('#sB').value.trim();
    DB.set.model=$('#sM').value.trim();
    DB.set.apiKey=$('#sK').value.trim();

    DB.set.ttsOn=$('#sT').checked;
    DB.set.autoAI=$('#sA').checked;
    save();renderCD();closeModal();
    if(after)after();else{renderHead();renderNav();renderAll()}
  };
  $('#sShare').onclick=buildShareHTML;
  $('#sExp').onclick=doExport;
  $('#sImp').onclick=()=>$('#sFile').click();
  $('#sFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        Object.assign(DB,o);
        DB.set=Object.assign({},DEF_SET,o.set||{});
        save();closeModal();
        location.reload();
      }catch(_){alert('備份檔格式錯誤')}
    };
    r.readAsText(f);e.target.value='';
  };
  $('#sRst').onclick=()=>{
    if(confirm('確定清除所有資料（進度、自訂題目、學習時間、閃卡、設定）？此動作無法復原。')){
      localStorage.removeItem(KEY);location.reload();
    }
  };
  $$('#mGen [data-close]').forEach(b=>b.onclick=closeModal);
}

/* ══════════ 產生分享版網頁（烘焙共用內容進 HTML） ══════════ */
function buildShareHTML(){
  try{
    closeModal();
    /* 清空已渲染內容，讓產出的檔案回到乾淨初始狀態（init 會重新渲染） */
    ['k','q','t','h'].forEach(t=>{const e=$('#pane-'+t);if(e)e.innerHTML=''});
    const sh=$('#shead');if(sh)sh.innerHTML='';
    const nv=$('#subnav');if(nv)nv.innerHTML='';

    const seed={
      custom:DB.custom||[],
      cards:DB.cards||{},
      set:{dseYear:DB.set.dseYear,examDate:DB.set.examDate},
      by:DB.set.roleName||'',
      at:todayStr()
    };
    /* 避免結尾標籤字面量破壞網頁結構（下方以字串拼接方式處理） */
    const seedJSON=JSON.stringify(seed).replace(/<\/script/gi,'<\\/script');
    let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const inject='<script>window.__SHARED_SEED__='+seedJSON+';<\/script>';
    if(html.indexOf('</head>')<0){alert('頁面結構異常，無法產生分享版。');return}
    html=html.replace('</head>',inject+'\n</head>');

    const n=(DB.custom||[]).length;
    const c=Object.values(DB.cards||{}).reduce((a,v)=>a+((v||[]).length),0);
    dl(new Blob([html],{type:'text/html;charset=utf-8'}),'DSE2027-分享版.html');
    setTimeout(()=>{
      alert('分享版網頁已產生！\n\n'+
        '已打包：'+n+' 條自訂題目、'+c+' 張閃卡\n'+
        '（你的學習進度與計時記錄不會被打包）\n\n'+
        '下一步：\n'+
        '1. 開 https://app.netlify.com/drop\n'+
        '2. 把剛下載的檔案拖進去\n'+
        '3. 取得網址，傳給同學即完成');
    },400);
  }catch(e){
    console.warn(e);
    alert('產生失敗：'+e.message+'\n\n請先匯出備份 JSON，然後告訴我這個錯誤。');
  }
}

/* ══════════ 匯出 / 匯入 ══════════ */
function doExport(){
  const data={v:1,exportedAt:new Date().toISOString(),...DB};
  dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),
     'DSE2027-備份-'+todayStr()+'.json');
}
function doImport(){
  const f=$('#fileImp');
  f.value='';f.click();
}

/* ══════════ 初始化 ══════════ */
function init(){
  load();
  /* 恢復上次位置 */
  try{
    const last=JSON.parse(localStorage.getItem('dse2027-last'));
    if(last){STATE.grade=last.g||'S4';STATE.subject=last.s||'chi'}
  }catch(e){}
  if(!SUBJECTS.find(s=>s.id===STATE.subject))STATE.subject='chi';

  $$('#gradeSeg button').forEach(b=>b.onclick=()=>{
    STATE.grade=b.dataset.g;kFilter='all';
    renderNav();renderHead();renderAll();
    try{localStorage.setItem('dse2027-last',JSON.stringify({g:STATE.grade,s:STATE.subject}))}catch(e){}
  });

  $('#cdBtn').onclick=openCDPanel;
  $('#btnSet').onclick=()=>openSettings();
  $('#btnExp').onclick=doExport;
  $('#btnImp').onclick=doImport;
  $('#fileImp').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        Object.assign(DB,o);
        DB.set=Object.assign({},DEF_SET,o.set||{});
        save();location.reload();
      }catch(_){alert('備份檔格式錯誤')}
    };
    r.readAsText(f);
  };

  $$('#mGen .mh .x').forEach(b=>b.onclick=closeModal);
  $('#mGen').addEventListener('click',e=>{if(e.target.id==='mGen')closeModal()});
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if($('#mGen').classList.contains('on'))closeModal();
      else if($('#oral').classList.contains('on'))exitOral();
    }
  });

  renderNav();renderHead();renderTabs();renderAll();renderCD();
  setInterval(renderCD,60000);

  /* 分享版：首次開啟時提示已內建的共用內容 */
  if(window.__SHARED_META__&&!localStorage.getItem(KEY)){
    const m=window.__SHARED_META__;
    setTimeout(()=>{
      try{
        openModal('🎁 這是共用版學習平台',`
          <div class="hint b">已為你預載由${m.by?` <b>${esc(m.by)}</b> `:''}分享的內容：</div>
          <div class="readout" style="margin-top:12px">
            <div class="ro"><div class="l">共用自訂題目</div><div class="v">${m.n} 條</div></div>
            <div class="ro"><div class="l">共用閃卡</div><div class="v">${m.c} 張</div></div>
            <div class="ro"><div class="l">分享日期</div><div class="v">${esc(m.at||'—')}</div></div>
          </div>
          <div class="hint" style="margin-top:14px">
            這些內容已可直接練習。你自己的作答記錄、學習時間與知識點進度會
            <b>存在你自己的瀏覽器</b>，與分享者及其他同學完全分開，不會互相看到。<br><br>
            想加入自己的題目：到「練習題」分頁按「＋ 新增題目」，支援拍照上傳與貼上圖片。
          </div>
          <div style="margin-top:14px"><button class="btn pri" data-close>開始使用</button></div>`,
          ()=>{$$('#mGen [data-close]').forEach(b=>b.onclick=closeModal)});
      }catch(e){}
    },700);
  }

  /* 離開前自動停止計時 */
  window.addEventListener('beforeunload',e=>{
    if(tmRun){stopTimer()}
    if(ORAL.log.length&&ORAL.phase!=='done'){e.preventDefault();e.returnValue=''}
  });
  /* 語音列表載入後重新整理 */
  if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
}

document.addEventListener('DOMContentLoaded',init);

</script>
