/* ── 格式化 ── */
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(h>0)return h+' 小時 '+(m>0?m+' 分':'');
  if(m>0)return m+' 分 '+(s>0?s+' 秒':'');
  return s+' 秒';
}
function fmtHM(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  const m=Math.floor(sec/60),s=sec%60;
  return m+':'+String(s).padStart(2,'0');
}
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function subjStats(s,g){
  const grp=(s.K&&s.K[g])||[];
  let total=0,done=0;
  grp.forEach((G,gi)=>G.items.forEach((_,ii)=>{total++;if(DB.done[kOf(s.id,g+gi,ii)])done++}));
  return{total,done,pct:total?Math.round(done/total*100):0};
}
function allStats(s){
  let total=0,done=0;
  ['S4','S5','S6'].forEach(g=>{const st=subjStats(s,g);total+=st.total;done+=st.done});
  return{total,done,pct:total?Math.round(done/total*100):0};
}

let kOpen={};
function renderK(){
  const s=subj(),g=STATE.grade;
  const groups=(s.K&&s.K[g])||[];
  const st=subjStats(s,g);
  const p=$('#pane-k');
  let h=`
   <div class="sect">
    <div class="ktop">
      <div class="filt" style="flex:1">
        <input class="inp" id="kq" placeholder="搜尋知識點…" style="max-width:260px" value="${esc($('#kq')?$('#kq').value:'')}">
        <button class="pill ${kFilter==='all'?'on':''}" data-kf="all">全部</button>
        <button class="pill ${kFilter==='todo'?'on':''}" data-kf="todo">未完成</button>
        <button class="pill ${kFilter==='star'?'on':''}" data-kf="star">⭐ 已標記</button>
        <button class="btn sm" id="kExpand">全部展開</button>
        <button class="btn sm" id="kCollapse">全部收合</button>
      </div>
      <div style="font-size:13px" class="muted">
        <b style="font-size:16px;color:var(--tx)">${st.done}</b> / ${st.total} 已掌握 · 
        <b style="font-size:16px;color:var(--tx)">${st.pct}%</b>
      </div>
    </div>
    <div class="kgrid" id="kgrid"></div>
    <div class="empty" id="kNo" style="display:none">找不到相符的知識點。</div>
   </div>`;
  p.innerHTML=h;

  const grid=$('#kgrid');
  const q=($('#kq').value||'').trim().toLowerCase();
  let html='',shown=0;
  groups.forEach((G,gi)=>{
    let tot=0,dn=0;
    G.items.forEach((_,ii)=>{tot++;if(DB.done[kOf(s.id,g+gi,ii)])dn++});
    if(kFilter==='todo'&&dn===tot)return;
    let rows='';
    G.items.forEach((it,ii)=>{
      const k=kOf(s.id,g+gi,ii);
      if(q&&!it.toLowerCase().includes(q))return;
      if(kFilter==='todo'&&DB.done[k])return;
      if(kFilter==='star'&&!DB.star[k])return;
      rows+=`<div class="kitem">
        <input type="checkbox" id="cb-${s.id}-${g}${gi}-${ii}" data-k="${k}" ${DB.done[k]?'checked':''}>
        <label for="cb-${s.id}-${g}${gi}-${ii}">${esc(it)}</label>
        <span class="star ${DB.star[k]?'on':''}" data-k="${k}" title="標記">★</span>
      </div>`;
    });
    if(!rows)return;
    shown++;
    const open=kOpen[s.id+gi]!==false;
    /* 該知識點組的練習題數量 */
    const qn=allQuestions(s.id).filter(x=>x.g===g&&x.k===G.n).length;
    html+=`<div class="kgrp" data-gi="${gi}">
      <div class="kgh">
        <span class="mk2" style="--sc:${s.color}"></span>
        <h3>${esc(G.n)}</h3>
        <span class="n">${dn}/${tot}</span>
        ${qn?`<button class="btn sm kpq" data-kpq="${esc(G.n)}" title="只練習這個知識點的題目">🎯 練習 ${qn} 題</button>`:''}
      </div>
      <div class="pbar"><i style="width:${tot?Math.round(dn/tot*100):0}%"></i></div>
      <div class="kbody ${open?'':'hide'}">${rows}</div>
    </div>`;
  });
  grid.innerHTML=html||'';
  $('#kNo').style.display=shown?'none':'block';

  grid.querySelectorAll('.kgh').forEach(hd=>hd.onclick=e=>{
    if(e.target.closest('.star'))return;
    const gi=hd.parentElement.dataset.gi,key=s.id+gi;
    kOpen[key]=kOpen[key]===false;
    hd.parentElement.querySelector('.kbody').classList.toggle('hide',kOpen[key]===false);
  });
  grid.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=e=>{
    const k=e.target.dataset.k;
    e.target.checked?DB.done[k]=1:delete DB.done[k];
    save();renderHead();renderK();
  });
  grid.querySelectorAll('.star').forEach(st2=>st2.onclick=e=>{
    e.stopPropagation();
    const k=st2.dataset.k;
    DB.star[k]?delete DB.star[k]:DB.star[k]=1;
    save();st2.classList.toggle('on',!!DB.star[k]);
  });
  $('#kq').oninput=renderK;
  $$('[data-kf]').forEach(b=>b.onclick=()=>{kFilter=b.dataset.kf;renderK()});
  $$('#kgrid [data-kpq]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    qFocusKp=b.dataset.kpq;qFilter='all';qGroupBy='kp';
    STATE.tab='q';renderTabs();renderQ();
  });
  $('#kExpand').onclick=()=>{groups.forEach((_,gi)=>kOpen[s.id+gi]=true);renderK()};
  $('#kCollapse').onclick=()=>{groups.forEach((_,gi)=>kOpen[s.id+gi]=false);renderK()};
}
let kFilter='all';

/* ══════════ 練習題 ══════════ */
let qFilter='all';
function allQuestions(sid){
  const built=BANK.filter(q=>q.s===sid);
  const custom=DB.custom.filter(q=>q.s===sid);
  return [...custom,...built];
}
/* 分組模式：'paper' 依卷別、'kp' 依知識點 */
let qGroupBy='kp';
/* 專項練習：鎖定某個知識點組（null = 全部） */
let qFocusKp=null;

/* 取得該科該年級的知識點組（含組名與細項） */
function kpGroups(sid,g){
  const s=SUBJECTS.find(x=>x.id===sid);
  return s&&s.K&&s.K[g]?s.K[g]:[];
}

function renderQ(){
  const s=subj(),p=$('#pane-q');
  const qs=allQuestions(s.id);
  const g=STATE.grade;
  const groups=kpGroups(s.id,g);

  const pass=q=>{
    if(qFocusKp&&q.k!==qFocusKp)return false;
    if(qFilter==='todo')return DB.ans[q.id]==null;
    if(qFilter==='done')return DB.ans[q.id]!=null;
    if(qFilter==='mine')return !!DB.custom.find(x=>x.id===q.id);
    if(qFilter==='star')return !!DB.star['q'+q.id];
    return true;
  };

  p.innerHTML=`
   <div class="sect">
    <div class="qbar">
      <div class="filt" style="flex:1">
        <button class="pill ${qFilter==='all'?'on':''}" data-qf="all">全部 <span class="n">${qs.length}</span></button>
        <button class="pill ${qFilter==='todo'?'on':''}" data-qf="todo">未作答</button>
        <button class="pill ${qFilter==='done'?'on':''}" data-qf="done">已作答</button>
        <button class="pill ${qFilter==='mine'?'on':''}" data-qf="mine">我的題目</button>
        <button class="pill ${qFilter==='star'?'on':''}" data-qf="star">⭐ 標記</button>
      </div>
      <div class="segsm" id="gseg">
        <button class="${qGroupBy==='kp'?'on':''}" data-gb="kp">按知識點</button>
        <button class="${qGroupBy==='paper'?'on':''}" data-gb="paper">按卷別</button>
      </div>
      <button class="btn pri" id="qAdd">＋ 新增題目</button>
      <button class="btn" id="qManage">管理</button>
    </div>
    ${qFocusKp?`<div class="focusbar">
      <span>🎯 專項練習：<b>${esc(qFocusKp)}</b></span>
      <button class="btn sm" id="qFocusExit">× 結束專項</button></div>`:''}
    <div id="qlist"></div>
    ${qs.length?'':'<div class="empty">此科目暫無練習題。點擊「新增題目」自行加入（支援拍照上傳、貼上圖片、文字輸入）。</div>'}
   </div>`;

  const list=$('#qlist');let html='';

  if(qGroupBy==='kp'){
    /* ── 依知識點分組：列出該年級所有知識點組，沒題目的組也顯示（標示待補） ── */
    const byKp={};
    qs.forEach(q=>{const k=q.k||'未分類';(byKp[k]=byKp[k]||[]).push(q)});

    groups.forEach((G,gi)=>{
      const arr=(byKp[G.n]||[]).filter(pass);
      if(qFocusKp&&G.n!==qFocusKp)return;
      if(!arr.length&&qFocusKp)return;
      /* 掌握度：該組已作答且答對的題數 */
      let done=0,right=0;
      (byKp[G.n]||[]).forEach(q=>{
        if(DB.ans[q.id]!=null){
          done++;
          if(q.type==='mc'&&Number(DB.ans[q.id])===q.ans)right++;
          else if(q.type!=='mc')right++;   /* 非選擇題自行核對，計入已處理 */
        }
      });
      const tot=(byKp[G.n]||[]).length;
      const pct=tot?Math.round(right/tot*100):0;

      html+=`<div class="kpgrp">
        <div class="kpgh" data-kp="${esc(G.n)}">
          <div class="kpgl">
            <span class="kpno">${gi+1}</span>
            <div>
              <div class="kpgt">${esc(G.n)}</div>
              <div class="kpgm">${tot} 題${tot?' · 已答 '+done+' · 掌握度 '+pct+'%':''}</div>
            </div>
          </div>
          <div class="kpgr">
            ${tot?`<div class="kpbar"><i style="width:${pct}%"></i></div>`:'<span class="kpnone">暫無題目</span>'}
            ${tot?`<button class="btn sm" data-focus="${esc(G.n)}">🎯 專項練習</button>`:''}
            <span class="kparr">▾</span>
          </div>
        </div>
        <div class="kpbody">
          <div class="kpitems">${G.items.map((it,ii)=>{
            const key=kOf(s.id,g+gi,ii);
            const on=!!DB.done[key];
            return `<span class="kpi ${on?'on':''}" data-ki="${key}">${on?'✓ ':''}${esc(it)}</span>`;
          }).join('')}</div>
          ${arr.length?arr.map((q,i)=>qHTML(q,i)).join('')
            :(tot?'<div class="empty sm">此篩選條件下沒有題目。</div>'
                 :'<div class="empty sm">此知識點暫無練習題。按「＋ 新增題目」加入時，可選擇歸入本知識點。</div>')}
        </div>
      </div>`;
    });

    /* 未歸類的自訂題目 */
    const rest=qs.filter(q=>!q.k).filter(pass);
    if(rest.length&&!qFocusKp){
      html+=`<div class="kpgrp">
        <div class="kpgh"><div class="kpgl"><span class="kpno">＋</span>
          <div><div class="kpgt">未分類</div>
          <div class="kpgm">${rest.length} 題 · 建議編輯時指定知識點</div></div></div>
          <div class="kpgr"><span class="kparr">▾</span></div></div>
        <div class="kpbody">${rest.map((q,i)=>qHTML(q,i)).join('')}</div>
      </div>`;
    }
  }else{
    /* ── 依卷別分組（原有模式） ── */
    const byPaper={};
    qs.filter(pass).forEach(q=>{(byPaper[q.p||'其他']=byPaper[q.p||'其他']||[]).push(q)});
    Object.keys(byPaper).forEach(paper=>{
      const arr=byPaper[paper];
      if(!arr.length)return;
      html+=`<div style="margin:16px 0 9px;font-size:13px;font-weight:700;color:var(--mu);letter-spacing:.4px">
        ${esc(paper)} · ${arr.length} 題</div>`;
      arr.forEach((q,i)=>html+=qHTML(q,i));
    });
  }

  list.innerHTML=html||'<div class="empty">此篩選條件下沒有題目。</div>';

  /* ── 事件綁定 ── */
  $$('[data-qf]').forEach(b=>b.onclick=()=>{qFilter=b.dataset.qf;renderQ()});
  $$('#gseg [data-gb]').forEach(b=>b.onclick=()=>{qGroupBy=b.dataset.gb;renderQ()});
  const fe=$('#qFocusExit');
  if(fe)fe.onclick=()=>{qFocusKp=null;renderQ()};
  $$('#qlist [data-focus]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();qFocusKp=b.dataset.focus;renderQ();
    const el=$('#qlist');if(el)el.scrollTop=0;
  });
  /* 知識點組標題：收合 / 展開 */
  $$('#qlist .kpgh').forEach(h=>h.onclick=()=>{
    const grp=h.parentElement;grp.classList.toggle('collapse');
  });
  /* 知識點細項：勾選掌握 */
  $$('#qlist [data-ki]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const k=el.dataset.ki;
    if(DB.done[k])delete DB.done[k];else DB.done[k]=1;
    save();renderQ();renderHead&&renderHead();
  });
  bindQ();
  $('#qAdd').onclick=()=>openEditor(null);
  $('#qManage').onclick=openManager;
}

function qHTML(q,i){
  const c=DB.custom.find(x=>x.id===q.id);
  const own=c?'<span class="owner mine">自訂</span>':'<span class="owner sys">題庫</span>';
  const star=DB.star['q'+q.id];
  let body='';
  if(q.type==='mc'){
    const picked=DB.ans[q.id];
    body=`<div class="opts">${q.opts.map((o,j)=>{
      let cls='opt';
      if(picked!=null){
        if(Number(picked)===Number(j))cls+=Number(j)===q.ans?' sel right':' sel wrong';
        else if(Number(j)===q.ans)cls+=' right';
      }
      return `<div class="${cls}" data-q="${q.id}" data-o="${j}"><span class="k">${'ABCD'[j]}</span><span>${tex2html(o)}</span></div>`;
    }).join('')}</div>`;
  }else{
    body=`<textarea class="ta" data-q="${q.id}" rows="3" placeholder="在此輸入你的答案…">${esc(DB.ans[q.id]||'')}</textarea>`;
  }
  /* ans 可以是 0（選項 A），不能用 truthy 判斷，否則「查看答案」按鈕會消失 */
  const hasAns=(q.ans!=null||q.ansTxt||q.ex)?1:0;
  return `<div class="qcard" data-id="${q.id}">
    <div class="qh">
      <span class="qno">${i+1}</span>
      <div class="qt">${tex2html(q.q)}</div>
      ${own}
      <span class="star ${star?'on':''}" data-qs="${q.id}" title="標記">★</span>
      ${c?`<button class="btn sm" data-edit="${q.id}">編輯</button>`:''}
    </div>
    ${q.imgs&&q.imgs.length?`<div class="qimgs">${q.imgs.map(u=>`<img src="${u}" onclick="zoomImg('${u}')">`).join('')}</div>`:''}
    ${body}
    <div class="qact">
      ${q.type==='mc'?`<button class="btn sm pri" data-chk="${q.id}">核對答案</button>`:''}
      ${hasAns?`<button class="btn sm" data-ans="${q.id}">查看答案與解析</button>`:''}
      ${q.graph?`<button class="btn sm" data-gr="${q.id}">🖊 圖形標註</button>`:''}
      ${q.type==='mc'?`<button class="btn sm" data-clear="${q.id}">清除</button>`:''}
    </div>
    ${hasAns?`<div class="ans" id="ans-${q.id}">
      ${(q.ansTxt||(q.type==='mc'&&q.opts&&q.opts[q.ans]!=null)||q.ans!=null)?
        `<div class="tag">參考答案</div><div>${tex2html(
          q.ansTxt || (q.opts?String(q.opts[q.ans]):String(q.ans))
        )}</div>`:''}
      ${q.ex?`<div class="ex"><b>解析：</b>${tex2html(q.ex)}</div>`:''}
    </div>`:''}
  </div>`;
}

function bindQ(){
  $$('#qlist .opt').forEach(o=>o.onclick=()=>{
    const qid=o.dataset.q;
    $$(`#qlist .opt[data-q="${qid}"]`).forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');
    const q=allQuestions(STATE.subject).find(x=>x.id===qid);
    DB.ans[qid]=o.dataset.o;save();
    if(q&&q.type==='mc'){
      $$(`#qlist .opt[data-q="${qid}"]`).forEach(x=>{
        x.classList.remove('right','wrong');
        if(Number(x.dataset.o)===q.ans)x.classList.add('right');
        else if(Number(x.dataset.o)===Number(o.dataset.o))x.classList.add('wrong');
      });
    }
  });
  $$('#qlist [data-chk]').forEach(b=>b.onclick=()=>{
    const qid=b.dataset.chk;
    const q=allQuestions(STATE.subject).find(x=>x.id===qid);
    if(DB.ans[qid]==null){alert('請先選擇答案');return}
    $$(`#qlist .opt[data-q="${qid}"]`).forEach(x=>{
      x.classList.remove('right','wrong');
      if(Number(x.dataset.o)===q.ans)x.classList.add('right');
      else if(Number(x.dataset.o)===Number(DB.ans[qid]))x.classList.add('wrong');
    });
    const ok=Number(DB.ans[qid])===q.ans;
    b.textContent=ok?'✓ 正確':'✗ 不正確';
    b.classList.toggle('ok',ok);b.classList.toggle('dg',!ok);
  });
  $$('#qlist [data-ans]').forEach(b=>b.onclick=()=>{
    const el=$('#ans-'+b.dataset.ans);
    const on=el.classList.toggle('on');
    b.textContent=on?'收起答案':'查看答案與解析';
  });
  $$('#qlist [data-clear]').forEach(b=>b.onclick=()=>{
    const qid=b.dataset.clear;delete DB.ans[qid];save();renderQ();
  });
  $$('#qlist [data-gr]').forEach(b=>b.onclick=()=>openGraph(b.dataset.gr));
  $$('#qlist [data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));
  $$('#qlist [data-qs]').forEach(st=>st.onclick=()=>{
    const k='q'+st.dataset.qs;
    DB.star[k]?delete DB.star[k]:DB.star[k]=1;save();
    st.classList.toggle('on',!!DB.star[k]);
  });
  $$('#qlist textarea[data-q]').forEach(t=>t.onchange=()=>{
    if(t.value.trim())DB.ans[t.dataset.q]=t.value;else delete DB.ans[t.dataset.q];
    save();
  });
}

function subjById(id){return SUBJECTS.find(s=>s.id===id)||{name:'（已移除科目）',color:'#94a3b8'}}
function startTimer(sid){
  tmSubj=sid;tmSec=0;tmRun=setInterval(()=>{tmSec++;const e=$('#tmClock');if(e)e.textContent=fmtClock(tmSec)},1000);
  renderH();
}
function stopTimer(){
  clearInterval(tmRun);tmRun=null;
  if(tmSec>0){
    DB.time[tmSubj]=(DB.time[tmSubj]||0)+tmSec;
    DB.sess.push({s:tmSubj,d:todayStr(),dur:tmSec,note:''});
    save();
  }
  tmSec=0;renderH();renderHead();
}
function addManual(){
  const mins=prompt('輸入學習分鐘數：','60');
  if(mins==null)return;
  const m=parseFloat(mins);
  if(isNaN(m)||m<=0){alert('請輸入有效數字');return}
  const note=prompt('備註（可留空）：','')||'';
  const s=subj();
  DB.time[s.id]=(DB.time[s.id]||0)+Math.round(m*60);
  DB.sess.push({s:s.id,d:todayStr(),dur:Math.round(m*60),note});
  save();renderH();
}

    <button class="btn pri" id="gSave">↓ 存成圖片</button>
    <span class="muted" style="font-size:12px;align-self:center">標註可用於幾何證明、函數草圖、受力圖等；座標軸模式適合 M2 曲線標註。</span>
  </div>`;

  const cv=host.querySelector('#gcv'),ctx=cv.getContext('2d');
  let tool='pen',color='#1f2937',lw=2,snap=true,showGrid=true,bgMode=0;
  let hist=[],drawing=null,start=null,img=null;

  const BGS=['格線','空白','座標軸'];
  function redraw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    if(showGrid&&bgMode!==1){
      ctx.strokeStyle=bgMode===2?'#eef1f5':'#e8ecf1';ctx.lineWidth=1;
      for(let x=0;x<=cv.width;x+=25){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}
      for(let y=0;y<=cv.height;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}
      if(bgMode===0){
        ctx.strokeStyle='#d7dde5';
        for(let x=0;x<=cv.width;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}
        for(let y=0;y<=cv.height;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}
      }
    }
    if(bgMode===2){
      const ox=cv.width/2,oy=cv.height/2;
      ctx.strokeStyle='#94a3b8';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(cv.width,oy);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,cv.height);ctx.stroke();
      ctx.fillStyle='#64748b';ctx.font='12px sans-serif';
      for(let i=-Math.floor(ox/50);i<=Math.floor(ox/50);i++){
        if(!i)continue;const x=ox+i*50;
        ctx.beginPath();ctx.moveTo(x,oy-4);ctx.lineTo(x,oy+4);ctx.stroke();
        ctx.fillText(i,x-6,oy+17);
      }
      for(let i=-Math.floor(oy/50);i<=Math.floor(oy/50);i++){
        if(!i)continue;const y=oy+i*50;
        ctx.beginPath();ctx.moveTo(ox-4,y);ctx.lineTo(ox+4,y);ctx.stroke();
        ctx.fillText(-i,ox+7,y+4);
      }
      ctx.fillText('O',ox+6,oy-6);
    }
    if(img)ctx.drawImage(img,0,0);
  }
  function snapshot(){hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(hist.length>25)hist.shift()}
  const S=v=>snap?Math.round(v/25)*25:v;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};

  cv.onpointerdown=e=>{
    cv.setPointerCapture(e.pointerId);
    const p=pos(e);
    if(tool==='erase'){snapshot();return}
    if(tool==='text'){
      const t=prompt('輸入標註文字：');
      if(!t)return;
      snapshot();
      ctx.fillStyle=color;ctx.font=`${14+lw*2}px -apple-system,"PingFang SC",sans-serif`;
      ctx.fillText(t,S(p.x),S(p.y));
      return;
    }
    snapshot();
    start=p;
    img=ctx.getImageData(0,0,cv.width,cv.height);
    if(tool==='pen'){ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y)}
    drawing=tool;
  };
  cv.onpointermove=e=>{
    if(!drawing)return;
    const p=pos(e);
    if(drawing==='pen'){ctx.lineTo(p.x,p.y);ctx.stroke();return}
    ctx.putImageData(img,0,0);
    ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.setLineDash(drawing==='angle'?[]:[]);
    let x1=S(start.x),y1=S(start.y),x2=S(p.x),y2=S(p.y);
    if(drawing==='line'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
    else if(drawing==='rect'){ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1))}
    else if(drawing==='circle'){
      const r=Math.hypot(x2-x1,y2-y1);ctx.beginPath();ctx.arc(x1,y1,r,0,7);ctx.stroke()}
    else if(drawing==='angle'){
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y1);ctx.stroke();
      const r=Math.min(38,Math.hypot(x2-x1,y2-y1)/3);
      const a0=0,a1=Math.atan2(y2-y1,x2-x1);
      ctx.beginPath();ctx.arc(x1,y1,r,Math.min(a0,a1),Math.max(a0,a1));ctx.stroke();
      ctx.fillStyle=color;ctx.font='13px sans-serif';
      ctx.fillText(Math.round(Math.abs(a1*180/Math.PI))+'°',x1+r*0.8,y1-6);
    }
  };
  cv.onpointerup=()=>{drawing=null};
  cv.onpointerleave=()=>{if(drawing){drawing=null}};

  host.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    tool=b.dataset.t;host.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    cv.style.cursor=tool==='text'?'text':tool==='erase'?'cell':'crosshair';
  });
  host.querySelectorAll('[data-c]').forEach(s=>s.onclick=()=>{
    color=s.dataset.c;host.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('on'));s.classList.add('on');
  });
  host.querySelector('#gw').oninput=e=>lw=+e.target.value;
  host.querySelector('#gsnap').onchange=e=>snap=e.target.checked;
  host.querySelector('#ggrid').onchange=e=>{showGrid=e.target.checked;snapshot();redraw()};
  host.querySelector('#gUndo').onclick=()=>{
    if(!hist.length)return;
    ctx.putImageData(hist.pop(),0,0);
  };
  host.querySelector('#gClear').onclick=()=>{if(confirm('清空整個畫布？')){snapshot();ctx.clearRect(0,0,cv.width,cv.height);redraw()}};
  const bb=host.querySelector('#gBg');
  bb.onclick=()=>{bgMode=(bgMode+1)%3;bb.textContent='背景：'+BGS[bgMode];redraw()};
  host.querySelector('#gSave').onclick=()=>{
    const a=document.createElement('a');
    a.download='標註-'+(subj()?subj().name:'')+'-'+Date.now()+'.png';
    a.href=cv.toDataURL('image/png');a.click();
  };
  redraw();
}

/* ═══════════════════════════════════════════════════
   2. M2 函數繪圖器（含安全表達式求值）
   ═══════════════════════════════════════════════════ */
/* ── 遞歸下降解析器 ── */
function parseExpr(src){
  const F={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,
    sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,exp:Math.exp,sqrt:Math.sqrt,abs:Math.abs,
    ln:Math.log,log:Math.log10||(x=>Math.log(x)/Math.LN10),floor:Math.floor,ceil:Math.ceil,
    round:Math.round,sign:Math.sign};
  const C={pi:Math.PI,PI:Math.PI,e:Math.E,E:Math.E};
  let i=0;
  const s=String(src).replace(/\s+/g,'').replace(/\*\*/g,'^').replace(/÷/g,'/').replace(/×/g,'*')
    .replace(/−/g,'-').replace(/–/g,'-').replace(/[（]/g,'(').replace(/[）]/g,')');
  const peek=()=>s[i];
  const eat=c=>{if(s[i]===c){i++;return true}return false};
  function num(){
    let j=i;
    if(/[0-9.]/.test(s[j])){while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      const n=parseFloat(s.slice(i,j));if(isNaN(n))err();i=j;return()=>n}
    if(s[j]==='-'){j++;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      const n=parseFloat(s.slice(i,j));if(isNaN(n))err();i=j;return()=>n}
    err();
  }
  function err(){throw new Error('算式無法解析')}
  function prim(){
    if(eat('(')){const v=expr();if(!eat(')'))err();return v}
    if(eat('-')){const p=prim();return x=>-p(x)}
    if(eat('+'))return prim();
    if(/[0-9.]/.test(peek()||''))return num();
    let j=i;while(j<s.length&&/[a-zA-Z]/.test(s[j]))j++;
    if(j===i)err();
    /* 由長至短嘗試匹配已知名稱，讓 sinx 可拆成 sin + x */
    while(j>i){
      const cand=s.slice(i,j);
      if(F[cand]||C[cand]!==undefined||cand==='x'||cand==='X'||cand==='t'||cand==='T'||cand==='th')break;
      j--;
    }
    if(j===i)err();
    const name=s.slice(i,j);i=j;
    if(eat('(')){
      const args=[];
      if(!eat(')')){do{args.push(expr())}while(eat(','));if(!eat(')'))err()}
      if(name==='log'&&args.length===2)return(x)=>Math.log(args[1](x))/Math.log(args[0](x));
      if(F[name])return args.length===1?(x)=>F[name](args[0](x)):err();
      err();
    }
    if(name==='x'||name==='X')return x=>x;
    if(name==='t'||name==='T')return x=>x;
    if(name==='th')return x=>x;
    if(C[name]!==undefined){const v=C[name];return()=>v}
    err();
  }
  function pow(){
    let b=prim();
    if(eat('^')){const e2=pow();return x=>Math.pow(b(x),e2(x))}
    return b;
  }
  /* 一元符號層：優先級低於冪運算，故 -x^2 解作 -(x^2) 而非 (-x)^2
     （與 Python / 一般數學慣例一致）。prim() 內亦保留負號以支援 2^-1。 */
  function unary(){
    if(eat('-')){const p=unary();return x=>-p(x)}
    if(eat('+'))return unary();
    return pow();
  }
  function mul(){
    let a=unary();
    for(;;){
      if(eat('*')){const b=unary();const p=a;a=x=>p(x)*b(x)}
      else if(eat('/')){const b=unary();const p=a;a=x=>p(x)/b(x)}
      else{
        /* 隱式乘法：2x、3(x+1)、2sin(x)、x y */
        const c=s[i];
        if(c&&(/[0-9.]/.test(c)||/[a-zA-Z(]/.test(c))){
          const b=unary();const p=a;a=x=>p(x)*b(x);
        }else break;
      }
    }
    return a;
  }
  function expr(){
    let a=mul();
    for(;;){
      if(eat('+')){const b=mul();const p=a;a=x=>p(x)+b(x)}
      else if(eat('-')){const b=mul();const p=a;a=x=>p(x)-b(x)}
      else break;
    }
    return a;
  }
  const f=expr();
  if(i<s.length)err();
  return f;
}
function compileExpr(src){
  const f=parseExpr(src);
  return x=>{const v=f(x);return (typeof v==='number'&&isFinite(v))?v:NaN};
}

const PLOT_COLORS=['#2563eb','#dc2626','#059669','#d97706','#7c3aed','#0891b2','#db2777','#65a30d'];

function toolPlot(host){
  host.innerHTML=`
  <div class="equ-list" id="eqs"></div>
  <div class="eqbox">
    <input class="inp" id="nq" placeholder="輸入方程式，如 x^2-6*x+9、sin(x)、ln(x)、e^x、1/(x-1)…">
    <button class="btn pri" id="addEq">＋ 加入曲線</button>
  </div>
  <div class="palette">
    <span class="t">模式</span>
    <button class="btn sm on" data-m="cart">直角坐標 y = f(x)</button>
    <button class="btn sm" data-m="param">參數式 x(t), y(t)</button>
    <button class="btn sm" data-m="polar">極坐標 r = f(θ)</button>
  </div>
  <div class="ctrlrow">
    <div class="fld"><label>X 範圍：-<span id="xrV">10</span> 至 <span id="xrV2">10</span></label>
      <input type="range" id="xr" min="2" max="30" value="10"></div>
    <div class="fld"><label>Y 範圍：-<span id="yrV">6</span> 至 <span id="yrV2">6</span></label>
      <input type="range" id="yr" min="2" max="30" value="6"></div>
    <div class="fld" style="flex:0 0 auto">
      <label>顯示</label>
      <label style="font-size:12.5px;display:flex;gap:5px;align-items:center"><input type="checkbox" id="pDeriv"> 導數曲線</label>
      <label style="font-size:12.5px;display:flex;gap:5px;align-items:center"><input type="checkbox" id="pInteg"> 定積分面積</label>
      <label style="font-size:12.5px;display:flex;gap:5px;align-items:center"><input type="checkbox" id="pGrid" checked> 格線</label>
    </div>
  </div>
  <div class="ctrlrow" id="intRow" style="display:none">
    <div class="fld"><label>積分下限 a = <span class="v" id="iaV">0</span></label>
      <input type="range" id="ia" min="-100" max="100" value="0"></div>
    <div class="fld"><label>積分上限 b = <span class="v" id="ibV">2</span></label>
      <input type="range" id="ib" min="-100" max="100" value="20"></div>
  </div>
  <canvas id="pcv" class="cvs" width="900" height="440" style="width:100%;height:auto;background:#fff"></canvas>
  <div class="readout" id="pout"></div>
  <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
    <button class="btn" id="pSave">↓ 存成圖片</button>
    <button class="btn" id="pReset">重置視窗</button>
    <span class="muted" style="font-size:12px;align-self:center">
      支援：+ − * / ^ ( )、sin cos tan ln log exp sqrt abs、常數 pi e。可同時加入多條曲線，拖曳平移、滾輪縮放。</span>
  </div>`;

  const cv=host.querySelector('#pcv'),ctx=cv.getContext('2d');
  let eqs=[],mode='cart';
  let xr=10,yr=6,ox=0,oy=0;
  let showD=false,showI=false,grid=true,ia=0,ib=2;

  function renderList(){
    const el=host.querySelector('#eqs');
    el.innerHTML=eqs.map((e,i)=>`
      <div class="equ">
        <span class="dot" style="background:${e.color}"></span>
        <input value="${esc(e.src)}" data-i="${i}" data-f="${e.k}">
        ${e.err?'<span class="err">算式無效</span>':''}
        <button class="x" data-del="${i}">×</button>
      </div>`).join('')||'<div class="muted" style="font-size:13px;padding:4px">尚未加入曲線，於上方輸入後按「加入曲線」。</div>';
    el.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
      const i=+inp.dataset.i;
      eqs[i][inp.dataset.f]=inp.value;
      eqs[i].src=eqs[i].y;
      comp();draw();renderList();
    });
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{eqs.splice(+b.dataset.del,1);comp();draw();renderList()});
  }
  function comp(){
    eqs.forEach(e=>{
      e.err=false;
      try{
        if(mode==='cart'){e.f=compileExpr(e.y);e.g=null}
        else if(mode==='param'){e.f=compileExpr(e.y);e.g=compileExpr(e.x2)}
        else{e.f=compileExpr(e.y)}
      }catch(err){e.err=true;e.f=null}
    });
  }
  function addEq(){
    const v=host.querySelector('#nq').value.trim();
    if(!v)return;
    if(mode==='param'){
      const parts=v.split(';').map(x=>x.trim());
      eqs.push({src:v,y:parts[1]||'',x2:parts[0]||'',color:PLOT_COLORS[eqs.length%PLOT_COLORS.length],err:false});
    }else{
      eqs.push({src:v,y:v,color:PLOT_COLORS[eqs.length%PLOT_COLORS.length],err:false});
    }
    host.querySelector('#nq').value='';
    comp();draw();renderList();
  }
  function add(v){
    host.querySelector('#nq').value=v;addEq();
  }

  const W=()=>cv.width,H=()=>cv.height;
  const sx=v=>W()/2+(v-ox)*(W()/(2*xr));
  const sy=v=>H()/2-(v-oy)*(H()/(2*yr));
  const ux=px=>(px-W()/2)/(W()/(2*xr))+ox;
  const uy=py=>oy-(py-H()/2)/(H()/(2*yr));

  function draw(){
    ctx.clearRect(0,0,W(),H());
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W(),H());
    const stepX=xr<=5?0.5:xr<=12?1:xr<=30?2:5;
    const stepY=yr<=3?0.5:yr<=8?1:yr<=20?2:5;
    if(grid){
      ctx.strokeStyle='#eef1f5';ctx.lineWidth=1;
      const x0=ux(0),x1=ux(W()),y0=uy(H()),y1=uy(0);
      for(let v=Math.ceil(x0/stepX)*stepX;v<=x1;v+=stepX){
        const px=sx(v);
        ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H());ctx.stroke();
      }
      for(let v=Math.ceil(y0/stepY)*stepY;v<=y1;v+=stepY){
        const py=sy(v);
        ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W(),py);ctx.stroke();
      }
    }
    /* 座標軸 */
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.6;
    const ax=sy(0),ay=sx(0);
    if(ax>=0&&ax<=H()){ctx.beginPath();ctx.moveTo(0,ax);ctx.lineTo(W(),ax);ctx.stroke()}
    if(ay>=0&&ay<=W()){ctx.beginPath();ctx.moveTo(ay,0);ctx.lineTo(ay,H());ctx.stroke()}
    ctx.fillStyle='#64748b';ctx.font='11px monospace';
    for(let v=Math.ceil(ux(0));v<=ux(W());v++){
      if(!v)continue;const px=sx(v);if(px<0||px>W())continue;
      ctx.beginPath();ctx.moveTo(px,ax-4);ctx.lineTo(px,ax+4);ctx.stroke();
      if(Math.abs(ux(W())-ux(0))<26)ctx.fillText(v,px-6,ax+16);
    }
    for(let v=Math.ceil(uy(H()));v<=uy(0);v++){
      if(!v)continue;const py=sy(v);if(py<0||py>H())continue;
      ctx.beginPath();ctx.moveTo(ay-4,py);ctx.lineTo(ay+4,py);ctx.stroke();
      if(Math.abs(uy(0)-uy(H()))<26)ctx.fillText(v,ay+7,py+4);
    }

    /* 積分面積 */
    if(showI&&eqs[0]&&eqs[0].f){
      const a=Math.min(ia,ib),b=Math.max(ia,ib);
      ctx.fillStyle=eqs[0].color+'22';
      ctx.beginPath();
      let started=false;
      for(let px=sx(a);px<=sx(b);px+=1){
        const y=eqs[0].f(ux(px));
        if(!isFinite(y))continue;
        const py=sy(y);
        if(!started){ctx.moveTo(px,sy(0));ctx.lineTo(px,py);started=true}
        else ctx.lineTo(px,py);
      }
      if(started){ctx.lineTo(sx(b),sy(0));ctx.closePath();ctx.fill()}
    }

    /* 曲線 */
    eqs.forEach(e=>{
      if(!e.f||e.err)return;
      ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.beginPath();
      let first=true,prev=null;
      const N=1400;
      for(let k=0;k<=N;k++){
        let X,Y;
        if(mode==='cart'){X=ux(k/N*W());Y=e.f(X)}
        else if(mode==='param'){const t=ux(0)+(k/N)*(ux(W())-ux(0));X=e.g(t);Y=e.f(t)}
        else{const th=k/N*Math.PI*8;const r=e.f(th);X=r*Math.cos(th);Y=r*Math.sin(th)}
        if(!isFinite(X)||!isFinite(Y)){prev=null;first=true;continue}
        const px=sx(X),py=sy(Y);
        if(prev!==null&&Math.abs(py-prev)>H()*2){prev=null;first=true}
        if(first||prev===null){ctx.moveTo(px,py);first=false}else ctx.lineTo(px,py);
        prev=py;
      }
      ctx.stroke();
      /* 導數 */
      if(showD&&mode==='cart'){
        ctx.strokeStyle=e.color+'88';ctx.lineWidth=1.4;ctx.setLineDash([5,4]);ctx.beginPath();
        let f2=true;
        for(let k=0;k<=1400;k++){
          const X=ux(k/N*W()),h=1e-5;
          const d=(e.f(X+h)-e.f(X-h))/(2*h);
          if(!isFinite(d)){f2=true;continue}
          const px=sx(X),py=sy(d);
          if(f2){ctx.moveTo(px,py);f2=false}else ctx.lineTo(px,py);
        }
        ctx.stroke();ctx.setLineDash([]);
      }
    });

    /* 圖例 */
    let lx=14,ly=24;
    eqs.forEach(e=>{
      ctx.fillStyle=e.color;ctx.fillRect(lx,ly-9,12,12);
      ctx.fillStyle='#1f2937';ctx.font='12.5px -apple-system,sans-serif';
      ctx.fillText(e.err?e.src+'（無效）':(mode==='param'?`x=${e.x2}, y=${e.y}`:`y = ${e.y}`),lx+17,ly);
      ly+=19;
    });
    readout();
  }

  function simpson(f,a,b,n=2000){
    if(a===b)return 0;
    const h=(b-a)/n;let s=f(a)+f(b);
    for(let i=1;i<n;i++)s+=f(a+i*h)*(i%2?4:2);
    return s*h/3;
  }
  function readout(){
    const out=host.querySelector('#pout');
    let h='';
    eqs.forEach((e,i)=>{
      if(!e.f||e.err)return;
      const y0=e.f(0);
      h+=`<div class="ro"><div class="l">曲線 ${i+1}　y(0)</div>
        <div class="v" style="color:${e.color}">${isFinite(y0)?y0.toFixed(4):'—'}</div></div>`;
      if(mode==='cart'){
        const d0=(e.f(1e-5)-e.f(-1e-5))/2e-5;
        h+=`<div class="ro"><div class="l">f′(0) 數值導數</div>
          <div class="v">${isFinite(d0)?d0.toFixed(4):'—'}</div></div>`;
      }
    });
    if(mode==='cart'&&eqs[0]&&eqs[0].f&&!eqs[0].err){
      const f0=eqs[0].f,ex=[],roots=[];
      let pd=null;
      for(let k=1;k<1600;k++){
        const X=ux(k/1600*W()),h=(xr*2)/1600;
        const d=(f0(X+h)-f0(X-h))/(2*h);
        if(pd!==null&&isFinite(d)&&isFinite(pd)&&pd*d<0){
          let lo=X-h,hi=X;
          for(let it=0;it<60;it++){
            const mid=(lo+hi)/2;
            const dl=f0(mid-h)-f0(mid+h);
            if((f0(lo+h)-f0(lo-h))*dl<0)hi=mid;else lo=mid;
          }
          const X0=(lo+hi)/2,Y0=f0(X0);
          if(isFinite(X0)&&isFinite(Y0)&&Math.abs(X0)<xr*3&&Math.abs(Y0)<yr*3)
            ex.push([X0,Y0,d>0?'極小':'極大']);
        }
        if(pd!==null&&isFinite(f0(X))&&isFinite(pd)&&f0(X-h)*f0(X)<0)
          roots.push(X);
        pd=d;
      }
      ex.slice(0,3).forEach(([X,Y,t])=>{
        h+=`<div class="ro"><div class="l">${t}值點</div>
          <div class="v" style="font-size:13.5px">(${X.toFixed(3)}, ${Y.toFixed(3)})</div></div>`;
      });
      if(roots.length){
        const r2=[...new Set(roots.map(v=>v.toFixed(3)))].slice(0,4);
        h+=`<div class="ro"><div class="l">x 軸截距（根）</div>
          <div class="v" style="font-size:13.5px">${r2.join(' , ')}</div></div>`;
      }
    }
    if(showI&&eqs[0]&&eqs[0].f&&!eqs[0].err){
      const a=Math.min(ia,ib),b=Math.max(ia,ib);
      const v=simpson(eqs[0].f,a,b);
      h+=`<div class="ro"><div class="l">∫ f(x)dx 由 ${a.toFixed(2)} 至 ${b.toFixed(2)}</div>
        <div class="v" style="color:var(--pr)">${v.toFixed(4)}</div></div>`;
    }
    out.innerHTML=h||'<div class="ro"><div class="l">提示</div><div class="v" style="font-size:13px;font-weight:500">加入曲線後會顯示數值</div></div>';
  }

  host.querySelector('#addEq').onclick=addEq;
  host.querySelector('#nq').onkeydown=e=>{if(e.key==='Enter')addEq()};
  host.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    mode=b.dataset.m;
    host.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    host.querySelector('#nq').placeholder=mode==='param'?'輸入 x(t);y(t)，如 2*cos(t);3*sin(t)'
      :mode==='polar'?'輸入 r(θ)，如 1+2*cos(th)' :'輸入方程式，如 x^2-6*x+9、sin(x)、ln(x)、e^x、1/(x-1)…';
    comp();draw();renderList();
  });
  host.querySelector('#xr').oninput=e=>{xr=+e.target.value;host.querySelector('#xrV').textContent=xr;host.querySelector('#xrV2').textContent=xr;draw()};
  host.querySelector('#yr').oninput=e=>{yr=+e.target.value;host.querySelector('#yrV').textContent=yr;host.querySelector('#yrV2').textContent=yr;draw()};
  host.querySelector('#pDeriv').onchange=e=>{showD=e.target.checked;draw()};
  host.querySelector('#pGrid').onchange=e=>{grid=e.target.checked;draw()};
  host.querySelector('#pInteg').onchange=e=>{showI=e.target.checked;host.querySelector('#intRow').style.display=showI?'flex':'none';draw()};
  const iaEl=host.querySelector('#ia'),ibEl=host.querySelector('#ib');
  iaEl.oninput=e=>{ia=+e.target.value/10;host.querySelector('#iaV').textContent=ia.toFixed(1);draw()};
  ibEl.oninput=e=>{ib=+e.target.value/10;host.querySelector('#ibV').textContent=ib.toFixed(1);draw()};
  host.querySelector('#pSave').onclick=()=>{
    const a=document.createElement('a');a.download='函數圖-'+Date.now()+'.png';
    a.href=cv.toDataURL('image/png');a.click();
  };
  host.querySelector('#pReset').onclick=()=>{ox=0;oy=0;draw()};
  /* 平移與縮放 */
  let drag=null;
  cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{
    if(!drag)return;
    const r=cv.getBoundingClientRect();
    ox=drag.ox-(e.clientX-drag.x)*(2*xr)/r.width;
    oy=drag.oy+(e.clientY-drag.y)*(2*yr)/r.height;
    draw();
  };
  cv.onpointerup=()=>drag=null;
  cv.onwheel=e=>{e.preventDefault();const f=e.deltaY>0?1.15:1/1.15;xr*=f;yr*=f;
    host.querySelector('#xr').value=Math.min(30,xr);host.querySelector('#yr').value=Math.min(30,yr);
    draw()};

  /* 預設範例 */
  add('x^2 - 6*x + 9');
  add('sin(x)');
  renderList();draw();
}

function toolPhys(host){

  <div class="palette">

function mkCanvas(host,w,h){
  const cv=document.createElement('canvas');
  cv.width=w||900;cv.height=h||400;cv.className='cvs';
  cv.style.width='100%';cv.style.height='auto';cv.style.background='#fff';
  host.appendChild(cv);return cv;
}

function physProj(host){
  host.innerHTML=`
  <div class="ctrlrow">
    <div class="fld"><label>初速度 v<sub>0</sub> = <span class="v" id="vV">25</span> m s<sup>-1</sup></label>
      <input type="range" id="v" min="1" max="60" value="25"></div>
    <div class="fld"><label>發射角 θ = <span class="v" id="aV">45</span>°</label>
      <input type="range" id="a" min="1" max="89" value="45"></div>
    <div class="fld"><label>重力 g = <span class="v" id="gV">10</span> m s<sup>-2</sup></label>
      <input type="range" id="g" min="1" max="25" value="100"></div>
    <div class="fld" style="flex:0 0 auto"><label>顯示</label>
      <button class="btn sm" id="play">▶ 發射</button>
      <button class="btn sm" id="trail">軌跡：關</button></div>
  </div>
  <div id="cvHost"></div>
  <div class="readout" id="out"></div>`;
  const cv=mkCanvas(host.querySelector('#cvHost'),900,400),ctx=cv.getContext('2d');
  let v=25,a=45,g=10,t=0,running=false,trail=false,hist=[];
  const SC=4.2,OX=70,OY=340;
  const SX=x=>OX+x*SC, SY=y=>OY-y*SC;

  function calc(){
    const rad=a*Math.PI/180;
    const vx=v*Math.cos(rad),vy=v*Math.sin(rad);
    const T=2*vy/g, R=vx*T, H=vy*vy/(2*g);
    return{vx,vy,T,R,H};
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fbfcfd';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='#e6eaf0';ctx.lineWidth=1;
    for(let x=0;x<cv.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}
    for(let y=0;y<cv.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}
    ctx.fillStyle='#94a3b8';ctx.fillRect(0,OY,cv.width,4);
    const c=calc();
    /* 軌跡 */
    ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();
    for(let i=0;i<=240;i++){
      const tt=i/240*c.T;
      const x=c.vx*tt,y=c.vy*tt-0.5*g*tt*tt;
      if(y<-2)break;
      const px=SX(x),py=SY(y);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.stroke();ctx.setLineDash([]);
    /* 最高點 */
    ctx.fillStyle='#d97706';ctx.beginPath();ctx.arc(SX(c.R/2),SY(c.H),5,0,7);ctx.fill();
    ctx.fillStyle='#92400e';ctx.font='12px sans-serif';
    ctx.fillText('最高點 H = '+c.H.toFixed(1)+' m',SX(c.R/2)-32,SY(c.H)-11);
    /* 射程標示 */
    ctx.strokeStyle='#059669';ctx.beginPath();
    ctx.moveTo(SX(0),OY+16);ctx.lineTo(SX(c.R),OY+16);ctx.stroke();
    ctx.fillText('R = '+c.R.toFixed(1)+' m',SX(c.R/2)-26,OY+32);
    /* 向量 */
    const rad=a*Math.PI/180;
    ctx.strokeStyle='#dc2626';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(OX,OY);ctx.lineTo(OX+v*Math.cos(rad)*SC*1.6,OY-v*Math.sin(rad)*SC*1.6);ctx.stroke();
    ctx.fillStyle='#dc2626';ctx.font='12px sans-serif';ctx.fillText('v0',OX+v*Math.cos(rad)*SC*1.6+6,OY-v*Math.sin(rad)*SC*1.6);
    /* 角度弧 */
    ctx.beginPath();ctx.arc(OX,OY,34,-rad,0);ctx.stroke();
    ctx.fillText('θ = '+a+'°',OX+38,OY-8);
    /* 飛行中的球 */
    if(running||t>0){
      const tt=Math.min(t,c.T);
      const x=c.vx*tt,y=Math.max(0,c.vy*tt-0.5*g*tt*tt);
      if(trail)hist.push([x,y]);
      ctx.strokeStyle='#dc262688';ctx.lineWidth=3;ctx.beginPath();
      hist.forEach((p,i)=>{const px=SX(p[0]),py=SY(p[1]);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});
      ctx.stroke();
      ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(SX(x),SY(y),8,0,7);ctx.fill();
    }
    host.querySelector('#out').innerHTML=`
      <div class="ro"><div class="l">飛行時間 T</div><div class="v">${c.T.toFixed(2)} s</div></div>
      <div class="ro"><div class="l">水平射程 R</div><div class="v">${c.R.toFixed(2)} m</div></div>
      <div class="ro"><div class="l">最大高度 H</div><div class="v">${c.H.toFixed(2)} m</div></div>
      <div class="ro"><div class="l">水平／垂直初速</div><div class="v">${c.vx.toFixed(1)} / ${c.vy.toFixed(1)}</div></div>
      <div class="ro"><div class="l">最佳發射角</div><div class="v">45°</div></div>
      <div class="ro"><div class="l">45° 時最大射程</div><div class="v">${(v*v/g).toFixed(2)} m</div></div>`;
  }
  let raf=null;
  function loop(){
    if(!running)return;
    t+=0.016;
    const c=calc();
    if(t>c.T){running=false;t=c.T;host.querySelector('#play').textContent='▶ 發射'}
    draw();raf=requestAnimationFrame(loop);
  }
  host.querySelector('#v').oninput=e=>{v=+e.target.value;host.querySelector('#vV').textContent=v;draw()};
  host.querySelector('#a').oninput=e=>{a=+e.target.value;host.querySelector('#aV').textContent=a;draw()};
  host.querySelector('#g').oninput=e=>{g=+e.target.value/10;host.querySelector('#gV').textContent=g.toFixed(1);draw()};
  host.querySelector('#play').onclick=()=>{
    if(running){running=false;host.querySelector('#play').textContent='▶ 發射';cancelAnimationFrame(raf)}
    else{const c=calc();if(t>=c.T){t=0;hist=[]}running=true;host.querySelector('#play').textContent='⏸ 暫停';loop()}
  };
  const tb=host.querySelector('#trail');
  tb.onclick=()=>{trail=!trail;tb.textContent='軌跡：'+(trail?'開':'關');if(!trail)hist=[]};
  draw();
}

function physPend(host){
  host.innerHTML=`
  <div class="ctrlrow">
    <div class="fld"><label>擺長 L = <span class="v" id="lV">1.0</span> m</label>
      <input type="range" id="l" min="10" max="300" value="100"></div>
    <div class="fld"><label>重力 g = <span class="v" id="gV">9.81</span> m s<sup>-2</sup></label>
      <input type="range" id="g" min="100" max="2500" value="981"></div>
    <div class="fld"><label>起始角 θ<sub>0</sub> = <span class="v" id="aV">20</span>°</label>
      <input type="range" id="a" min="2" max="60" value="20"></div>
    <div class="fld" style="flex:0 0 auto"><label>操作</label>
      <button class="btn sm pri" id="go">▶ 開始</button></div>
  </div>
  <div id="cvHost"></div>
  <div class="readout">
    <div class="ro"><div class="l">週期 T = 2π√(L/g)</div><div class="v" id="tV">—</div></div>
    <div class="ro"><div class="l">頻率 f</div><div class="v" id="fV">—</div></div>
    <div class="ro"><div class="l">經過時間</div><div class="v" id="eV">0.0 s</div></div>
    <div class="ro"><div class="l">大擺角修正</div><div class="v" id="cV">—</div></div>
  </div>`;
  const cv=mkCanvas(host.querySelector('#cvHost'),900,380),ctx=cv.getContext('2d');
  let L=1,g=9.81,a0=20,t=0,run=false,raf=null;
  const OX=450,OY=40,PX=320;
  function T(){return 2*Math.PI*Math.sqrt(L/g)}
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fbfcfd';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#94a3b8';ctx.fillRect(OX-70,OY,140,8);
    const th=a0*Math.PI/180*Math.cos(2*Math.PI*t/T());
    const len=L*PX/3;
    const x=OX+len*Math.sin(th),y=OY+len*Math.cos(th);
    ctx.strokeStyle='#e2e8f0';ctx.setLineDash([4,4]);ctx.beginPath();
    ctx.moveTo(OX,OY);ctx.lineTo(OX,OY+len);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#475569';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(OX,OY);ctx.lineTo(x,y);ctx.stroke();
    ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.fill();
    ctx.strokeStyle='#d97706';ctx.lineWidth=1.5;ctx.beginPath();
    ctx.arc(OX,OY,60,-Math.PI/2,-Math.PI/2+th,th<0);ctx.stroke();
    ctx.fillStyle='#64748b';ctx.font='13px sans-serif';
    ctx.fillText('θ = '+(th*180/Math.PI).toFixed(1)+'°',OX+66,OY+74);
    ctx.fillText('L = '+L.toFixed(2)+' m',x+18,y);
    const tt=T();
    host.querySelector('#tV').textContent=tt.toFixed(3)+' s';
    host.querySelector('#fV').textContent=(1/tt).toFixed(3)+' Hz';
    host.querySelector('#eV').textContent=t.toFixed(1)+' s';
    const corr=tt*(1+Math.pow(Math.sin(a0*Math.PI/360),2)/4);
    host.querySelector('#cV').textContent=corr.toFixed(3)+' s';
  }
  function loop(){if(!run)return;t+=0.016;draw();raf=requestAnimationFrame(loop)}
  host.querySelector('#l').oninput=e=>{L=+e.target.value/100;host.querySelector('#lV').textContent=L.toFixed(2);draw()};
  host.querySelector('#g').oninput=e=>{g=+e.target.value/100;host.querySelector('#gV').textContent=g.toFixed(2);draw()};
  host.querySelector('#a').oninput=e=>{a0=+e.target.value;host.querySelector('#aV').textContent=a0;draw()};
  host.querySelector('#go').onclick=()=>{
    run=!run;host.querySelector('#go').textContent=run?'⏸ 暫停':'▶ 開始';
    if(run)loop();else cancelAnimationFrame(raf);
  };
  draw();
}

function physCirc(host){
  host.innerHTML=`
  <div class="ctrlrow">
    <div class="fld"><label>電壓 V = <span class="v" id="vV">12.0</span> V</label>
      <input type="range" id="v" min="10" max="240" value="120"></div>
    <div class="fld"><label>R<sub>1</sub> = <span class="v" id="r1V">10</span> Ω</label>
      <input type="range" id="r1" min="1" max="100" value="10"></div>
    <div class="fld"><label>R<sub>2</sub> = <span class="v" id="r2V">20</span> Ω</label>
      <input type="range" id="r2" min="1" max="100" value="20"></div>
    <div class="fld" style="flex:0 0 auto"><label>連接方式</label>
      <button class="btn sm on" id="ms">串聯</button>
      <button class="btn sm" id="mp">並聯</button></div>
  </div>
  <div id="cvHost"></div>
  <div class="readout" id="out"></div>`;
  const cv=mkCanvas(host.querySelector('#cvHost'),900,340),ctx=cv.getContext('2d');
  let V=12,R1=10,R2=20,ser=true;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fbfcfd';ctx.fillRect(0,0,cv.width,cv.height);
    const Req=ser?R1+R2:(R1*R2)/(R1+R2);
    const I=V/Req;
    ctx.strokeStyle='#475569';ctx.lineWidth=2.5;
    ctx.strokeRect(160,90,580,170);
    /* 電池 */
    ctx.fillStyle='#1f2937';ctx.fillRect(150,160,26,34);
    ctx.font='13px sans-serif';ctx.fillStyle='#1f2937';
    ctx.fillText(V.toFixed(1)+' V',146,148);
    /* 電阻 */
    const box=(x,y,label,val,col)=>{
      ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.strokeRect(x,y,74,34);
      ctx.fillStyle=col;ctx.font='13px sans-serif';
      ctx.fillText(label,x+6,y+22);
      ctx.fillText(val+' Ω',x+6,y+52);
    };
    if(ser){
      box(350,163,'R1',R1.toFixed(0),'#2563eb');
      box(530,163,'R2',R2.toFixed(0),'#dc2626');
      ctx.strokeStyle='#475569';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(176,177);ctx.lineTo(350,177);ctx.stroke();
      ctx.beginPath();ctx.moveTo(424,177);ctx.lineTo(530,177);ctx.stroke();
      ctx.beginPath();ctx.moveTo(604,177);ctx.lineTo(740,177);ctx.stroke();
    }else{
      box(380,95,'R1',R1.toFixed(0),'#2563eb');
      box(380,215,'R2',R2.toFixed(0),'#dc2626');
      ctx.strokeStyle='#475569';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(176,177);ctx.lineTo(330,177);ctx.stroke();
      ctx.beginPath();ctx.moveTo(330,177);ctx.lineTo(330,112);ctx.stroke();
      ctx.beginPath();ctx.moveTo(330,177);ctx.lineTo(330,232);ctx.stroke();
      ctx.beginPath();ctx.moveTo(330,112);ctx.lineTo(380,112);ctx.stroke();
      ctx.beginPath();ctx.moveTo(330,232);ctx.lineTo(380,232);ctx.stroke();
      ctx.beginPath();ctx.moveTo(454,112);ctx.lineTo(560,112);ctx.stroke();
      ctx.beginPath();ctx.moveTo(454,232);ctx.lineTo(560,232);ctx.stroke();
      ctx.beginPath();ctx.moveTo(560,112);ctx.lineTo(560,232);ctx.stroke();
      ctx.beginPath();ctx.moveTo(560,177);ctx.lineTo(740,177);ctx.stroke();
    }
    /* 電流動畫 */
    const t=Date.now()/1000;
    ctx.fillStyle='#f59e0b';
    const path=ser?[[176,177],[740,177]]:[[176,177],[330,177]];
    for(let k=0;k<9;k++){
      const f=((t*0.35+k/9)%1);
      const x=176+f*(740-176);
      ctx.beginPath();ctx.arc(x,177,4,0,7);ctx.fill();
    }
    const I1=ser?I:V/R1,I2=ser?I:V/R2;
    host.querySelector('#out').innerHTML=`
      <div class="ro"><div class="l">等效電阻 R<sub>eq</sub></div><div class="v">${Req.toFixed(2)} Ω</div></div>
      <div class="ro"><div class="l">總電流 I</div><div class="v">${I.toFixed(3)} A</div></div>
      <div class="ro"><div class="l">${ser?'R1 電壓降':'R1 支路電流'}</div><div class="v">${ser?(I*R1).toFixed(2)+' V':I1.toFixed(3)+' A'}</div></div>
      <div class="ro"><div class="l">${ser?'R2 電壓降':'R2 支路電流'}</div><div class="v">${ser?(I*R2).toFixed(2)+' V':I2.toFixed(3)+' A'}</div></div>
      <div class="ro"><div class="l">總功率 P = VI</div><div class="v">${(V*I).toFixed(2)} W</div></div>`;
  }
  host.querySelector('#v').oninput=e=>{V=+e.target.value/10;host.querySelector('#vV').textContent=V.toFixed(1);draw()};

function physRefr(host){
  host.innerHTML=`
  <div class="ctrlrow">
    <div class="fld"><label>入射角 θ<sub>1</sub> = <span class="v" id="aV">30</span>°</label>
      <input type="range" id="a" min="0" max="89" value="30"></div>
    <div class="fld"><label>介質 1 折射率 n<sub>1</sub> = <span class="v" id="n1V">1.33</span></label>
      <input type="range" id="n1" min="100" max="250" value="133"></div>
    <div class="fld"><label>介質 2 折射率 n<sub>2</sub> = <span class="v" id="n2V">1.00</span></label>
      <input type="range" id="n2" min="100" max="250" value="100"></div>
  </div>
  <div id="cvHost"></div>
  <div class="readout" id="out"></div>`;
  const cv=mkCanvas(host.querySelector('#cvHost'),900,380),ctx=cv.getContext('2d');
  let a=30,n1=1.33,n2=1.0;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fbfcfd';ctx.fillRect(0,0,cv.width,cv.height);
    const CX=450,CY=190;
    /* 介質分層 */
    ctx.fillStyle='#dbeafe';ctx.fillRect(0,0,cv.width,CY);
    ctx.fillStyle='#fef3c7';ctx.fillRect(0,CY,cv.width,cv.height-CY);
    ctx.strokeStyle='#64748b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,CY);ctx.lineTo(cv.width,CY);ctx.stroke();
    ctx.fillStyle='#1e40af';ctx.font='13px sans-serif';
    ctx.fillText('介質 1  n1 = '+n1.toFixed(2),18,26);
    ctx.fillStyle='#92400e';
    ctx.fillText('介質 2  n2 = '+n2.toFixed(2),18,cy2());
    function cy2(){return cv.height-16}
    const r1=a*Math.PI/180;
    const sn=n1*Math.sin(r1)/n2;
    const tot=sn>1;
    const r2=tot?0:Math.asin(sn);
    const L=260;
    /* 入射線 */
    ctx.strokeStyle='#dc2626';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(CX-L*Math.sin(r1),CY-L*Math.cos(r1));
    ctx.lineTo(CX,CY);ctx.stroke();
    /* 法線 */
    ctx.strokeStyle='#94a3b8';ctx.setLineDash([6,4]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(CX,CY-130);ctx.lineTo(CX,CY+130);ctx.stroke();ctx.setLineDash([]);
    /* 反射線 */
    ctx.strokeStyle='#dc262699';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(CX,CY);
    ctx.lineTo(CX+L*Math.sin(r1),CY-L*Math.cos(r1));ctx.stroke();
    /* 折射線 */
    if(tot){
      ctx.strokeStyle='#059669';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(CX,CY);
      ctx.lineTo(CX-L*Math.sin(r1),CY+L*Math.cos(r1));ctx.stroke();
      ctx.fillStyle='#065f46';ctx.font='bold 14px sans-serif';
      ctx.fillText('全反射！',CX-150,CY+70);
    }else{
      ctx.strokeStyle='#059669';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(CX,CY);
      ctx.lineTo(CX+L*Math.sin(r2),CY+L*Math.cos(r2));ctx.stroke();
    }
    /* 角度 */
    ctx.fillStyle='#dc2626';ctx.font='13px sans-serif';
    ctx.fillText('θ1 = '+a+'°',CX-100,CY-70);
    ctx.fillStyle='#059669';
    ctx.fillText(tot?'—':'θ2 = '+(r2*180/Math.PI).toFixed(1)+'°',CX+34,CY+66);
    const crit=n1>n2?Math.asin(n2/n1)*180/Math.PI:null;
    host.querySelector('#out').innerHTML=`
      <div class="ro"><div class="l">折射角 θ<sub>2</sub></div><div class="v">${tot?'全反射':(r2*180/Math.PI).toFixed(2)+'°'}</div></div>
      <div class="ro"><div class="l">臨界角 θc</div><div class="v">${crit?crit.toFixed(2)+'°':'不適用（n1 ≤ n2）'}</div></div>
      <div class="ro"><div class="l">斯涅爾定律</div><div class="v" style="font-size:12px">n<sub>1</sub>sinθ<sub>1</sub> = n<sub>2</sub>sinθ<sub>2</sub></div></div>
      <div class="ro"><div class="l">計算值 n<sub>1</sub>sinθ<sub>1</sub></div><div class="v">${(n1*Math.sin(r1)).toFixed(3)}</div></div>
      <div class="ro"><div class="l">相對折射率</div><div class="v">${(n2/n1).toFixed(3)}</div></div>`;
  }
  host.querySelector('#a').oninput=e=>{a=+e.target.value;host.querySelector('#aV').textContent=a;draw()};
  host.querySelector('#n1').oninput=e=>{n1=+e.target.value/100;host.querySelector('#n1V').textContent=n1.toFixed(2);draw()};
  host.querySelector('#n2').oninput=e=>{n2=+e.target.value/100;host.querySelector('#n2V').textContent=n2.toFixed(2);draw()};
  draw();
}

function physColl(host){
  host.innerHTML=`
  <div class="ctrlrow">
    <div class="fld"><label>m<sub>1</sub> = <span class="v" id="m1V">2.0</span> kg</label>
      <input type="range" id="m1" min="5" max="100" value="20"></div>
    <div class="fld"><label>u<sub>1</sub> = <span class="v" id="u1V">5.0</span> m s<sup>-1</sup></label>
      <input type="range" id="u1" min="-100" max="100" value="50"></div>
    <div class="fld"><label>m<sub>2</sub> = <span class="v" id="m2V">3.0</span> kg</label>
      <input type="range" id="m2" min="5" max="100" value="30"></div>
    <div class="fld"><label>u<sub>2</sub> = <span class="v" id="u2V">0.0</span> m s<sup>-1</sup></label>
      <input type="range" id="u2" min="-100" max="100" value="0"></div>
    <div class="fld" style="flex:0 0 auto"><label>碰撞類型</label>
      <button class="btn sm on" id="ce">彈性</button>
      <button class="btn sm" id="ci">完全非彈性</button></div>
  </div>
  <div style="margin:10px 0"><button class="btn pri" id="go">▶ 播放碰撞</button></div>
  <div id="cvHost"></div>
  <div class="readout" id="out"></div>`;
  const cv=mkCanvas(host.querySelector('#cvHost'),900,260),ctx=cv.getContext('2d');
  let m1=2,u1=5,m2=3,u2=0,elast=true,t=0,run=false,raf=null;
  function res(){
    if(elast){
      const v1=((m1-m2)*u1+2*m2*u2)/(m1+m2);
      const v2=((m2-m1)*u2+2*m1*u1)/(m1+m2);
      return{v1,v2};
    }
    const v=(m1*u1+m2*u2)/(m1+m2);
    return{v1:v,v2:v};
  }
  function KE(){return 0.5*m1*u1*u1+0.5*m2*u2*u2}
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fbfcfd';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#94a3b8';ctx.fillRect(0,180,cv.width,4);
    const r=res();
    const pr=1/(1+t*0.7);
    const x1=150+(run?Math.min(1,t*2.2):0)*(300)+u1*6*t*(run?1:0);
    const x2=560+u2*6*t;
    const px1=Math.min(x1,x2-52),px2=Math.max(x2,x1+52);
    const b=(x,c,m,lab,col)=>{
      ctx.fillStyle=col;ctx.fillRect(x,180-m*10-24,m*10+24,m*10+24);
      ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';
      ctx.fillText(lab,x+6,180-m*10-8);
      ctx.fillStyle='#1f2937';ctx.font='12px sans-serif';
      ctx.fillText(m.toFixed(1)+' kg',x+2,205);
    };
    b(px1,0,m1,'A','#2563eb');b(px2,0,m2,'B','#dc2626');
    host.querySelector('#out').innerHTML=`
      <div class="ro"><div class="l">碰撞前總動量</div><div class="v">${(m1*u1+m2*u2).toFixed(2)} kg m s<sup>−1</sup></div></div>
      <div class="ro"><div class="l">碰撞後 v<sub>1</sub></div><div class="v" style="color:var(--pr)">${r.v1.toFixed(2)} m s<sup>−1</sup></div></div>
      <div class="ro"><div class="l">碰撞後 v<sub>2</sub></div><div class="v" style="color:var(--er)">${r.v2.toFixed(2)} m s<sup>−1</sup></div></div>
      <div class="ro"><div class="l">碰撞後總動量</div><div class="v">${(m1*r.v1+m2*r.v2).toFixed(2)} kg m s<sup>−1</sup></div></div>
      <div class="ro"><div class="l">碰撞前總動能</div><div class="v">${KE().toFixed(2)} J</div></div>
      <div class="ro"><div class="l">碰撞後總動能</div><div class="v">${(0.5*m1*r.v1*r.v1+0.5*m2*r.v2*r.v2).toFixed(2)} J</div></div>
      <div class="ro"><div class="l">動能損失</div><div class="v">${(KE()-0.5*m1*r.v1*r.v1-0.5*m2*r.v2*r.v2).toFixed(2)} J</div></div>`;
  }
  function loop(){if(!run)return;t+=0.016;if(t>3){run=false;host.querySelector('#go').textContent='▶ 播放碰撞'}draw();raf=requestAnimationFrame(loop)}
  ['m1','u1','m2','u2'].forEach(id=>{
    host.querySelector('#'+id).oninput=e=>{
      const v=id.startsWith('m')?+e.target.value/10:+e.target.value/10;
      if(id==='m1')m1=v;if(id==='u1')u1=v;if(id==='m2')m2=v;if(id==='u2')u2=v;
      host.querySelector('#'+id+'V').textContent=v.toFixed(1);draw();
    };
  });
  host.querySelector('#ce').onclick=()=>{elast=true;host.querySelector('#ce').classList.add('on');host.querySelector('#ci').classList.remove('on');draw()};
  host.querySelector('#ci').onclick=()=>{elast=false;host.querySelector('#ci').classList.add('on');host.querySelector('#ce').classList.remove('on');draw()};
  host.querySelector('#go').onclick=()=>{t=0;run=true;host.querySelector('#go').textContent='⏸ 播放中';loop()};
  draw();
}

/* ═══════════ 4. 化學原子模型 ═══════════ */
const ELEMENTS=[
 [1,'H','氫'],[2,'He','氦'],[3,'Li','鋰'],[4,'Be','鈹'],[5,'B','硼'],[6,'C','碳'],[7,'N','氮'],
 [8,'O','氧'],[9,'F','氟'],[10,'Ne','氖'],[11,'Na','鈉'],[12,'Mg','鎂'],[13,'Al','鋁'],[14,'Si','矽'],
 [15,'P','磷'],[16,'S','硫'],[17,'Cl','氯'],[18,'Ar','氩'],[19,'K','鉀'],[20,'Ca','鈣'],
 [26,'Fe','鐵'],[29,'Cu','銅'],[30,'Zn','鋅'],[35,'Br','溴'],[47,'Ag','銀'],[53,'I','碘'],[79,'Au','金'],[82,'Pb','鉛']
];
/* 精確電子排布表（K, L, M, N, O, P 層）。
   中學階段第三層在 Ca 之前只填 8 個（4s 先於 3d 填充），
   故不能用單純的 2n^2 推算，改以實測排布查表。 */
const ARR={
 1:[1],2:[2],3:[2,1],4:[2,2],5:[2,3],6:[2,4],7:[2,5],8:[2,6],9:[2,7],10:[2,8],
 11:[2,8,1],12:[2,8,2],13:[2,8,3],14:[2,8,4],15:[2,8,5],16:[2,8,6],17:[2,8,7],18:[2,8,8],
 19:[2,8,8,1],20:[2,8,8,2],26:[2,8,14,2],29:[2,8,18,1],30:[2,8,18,2],35:[2,8,18,7],
 47:[2,8,18,18,1],53:[2,8,18,18,7],79:[2,8,18,32,18,1],82:[2,8,18,32,18,4]
};
function toolAtom(host){
  host.innerHTML=`
  <div class="palette">
    <span class="t">模式</span>
    <button class="btn sm on" data-am="atom">原子結構</button>
    <button class="btn sm" data-am="ptable">元素週期表</button>
    <button class="btn sm" data-am="mol">分子模型</button>
  </div>
  <div id="atBody"></div>`;
  const b=host.querySelector('#atBody');
  const R={atom:atomView,ptable:ptableView,mol:molView};
  host.querySelectorAll('[data-am]').forEach(x=>x.onclick=()=>{
    host.querySelectorAll('[data-am]').forEach(y=>y.classList.remove('on'));x.classList.add('on');
    R[x.dataset.am](b);
  });
  atomView(b);
}

function shellsOf(z){
  if(ARR[z])return[...ARR[z]];
  /* 查表以外的元素：按 2, 8, 18, 32 近似規則推算（僅作示意） */
  const out=[];let r=z;
  for(const cap of [2,8,18,32,32,18]){if(r<=0)break;out.push(Math.min(cap,r));r-=cap}
  return out;
}
function atomView(host){
  host.innerHTML=`
  <div class="ctrlrow">
    <div class="fld"><label>元素</label>
      <select class="sel" id="el">
        ${ELEMENTS.map(([z,s,n])=>`<option value="${z}" ${z===8?'selected':''}>${z} · ${s} ${n}</option>`).join('')}
      </select></div>
    <div class="fld" style="flex:0 0 auto"><label>動畫</label>
      <button class="btn sm pri" id="spin">⏸ 暫停電子</button></div>
    <div class="fld" style="flex:0 0 auto"><label>模型</label>
      <button class="btn sm on" id="mb">玻爾模型</button>
      <button class="btn sm" id="mc">電子雲</button></div>
  </div>
  <div id="cvHost"></div>
  <div class="readout" id="out"></div>`;
  const cv=mkCanvas(host.querySelector('#cvHost'),900,440),ctx=cv.getContext('2d');
  let z=8,spin=true,cloud=false,ang=0,raf=null;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fbfcfd';ctx.fillRect(0,0,cv.width,cv.height);
    const CX=cv.width/2,CY=cv.height/2;
    const sh=shellsOf(z);
    const el=ELEMENTS.find(e=>e[0]===z)||[z,'?','?'];
    if(cloud){
      /* 電子雲 */
      sh.forEach((n,si)=>{
        const R=60+si*62;
        const g=ctx.createRadialGradient(CX,CY,R*0.55,CX,CY,R*1.1);
        g.addColorStop(0,'rgba(37,99,235,0)');
        g.addColorStop(0.65,'rgba(37,99,235,'+(0.16-si*0.025)+')');
        g.addColorStop(1,'rgba(37,99,235,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,R*1.1,0,7);ctx.fill();
        ctx.strokeStyle='#cbd5e1';ctx.setLineDash([3,4]);ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#64748b';ctx.font='11px sans-serif';
        ctx.fillText('n = '+(si+1)+'('+n+'e-)',CX+R-46,CY-4);
      });
    }else{
      ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1.4;
      sh.forEach((n,si)=>{
        const R=58+si*58;
        ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.stroke();
        for(let k=0;k<n;k++){
          const a2=ang*(1/(si+1))+k*2*Math.PI/n;
          const x=CX+R*Math.cos(a2),y=CY+R*Math.sin(a2);
          ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();
          ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.fillText('−',x-2.5,y+3.5);
        }
      });
    }
    /* 原子核 */
    const ng=ctx.createRadialGradient(CX-5,CY-5,2,CX,CY,26);
    ng.addColorStop(0,'#f87171');ng.addColorStop(1,'#b91c1c');
    ctx.fillStyle=ng;ctx.beginPath();ctx.arc(CX,CY,24,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';
    ctx.fillText('+'+z,CX-(z>9?11:7),CY+4);
    /* 標題 */
    ctx.fillStyle='#1f2937';ctx.font='bold 17px -apple-system,sans-serif';
    ctx.fillText(el[1]+'　'+el[2],20,32);
    ctx.font='13px sans-serif';ctx.fillStyle='#64748b';
    ctx.fillText('原子序 '+z+'　電子排布 '+sh.join(', '),20,52);
    const grp=sh.length,val=sh[sh.length-1];
    let info='';
    if(val>=8||(grp===1&&val===2))info='貴氣體（最外層已滿）';
    else if(val<=3)info='金屬（易失去電子形成正離子）';
    else info='非金屬（易得到電子形成負離子）';
    host.querySelector('#out').innerHTML=`
      <div class="ro"><div class="l">原子序 Z</div><div class="v">${z}</div></div>
      <div class="ro"><div class="l">質子數 / 電子數</div><div class="v">${z} / ${z}</div></div>
      <div class="ro"><div class="l">電子層數</div><div class="v">${sh.length}</div></div>
      <div class="ro"><div class="l">電子排布</div><div class="v">${sh.join(' , ')}</div></div>
      <div class="ro"><div class="l">最外層電子數</div><div class="v">${val}</div></div>
      <div class="ro"><div class="l">週期 / 族</div><div class="v">${sh.length} / ${val>=8?'0（18）':val}</div></div>
      <div class="ro"><div class="l">化學性質</div><div class="v" style="font-size:13px">${info}</div></div>`;
  }
  function loop(){if(!spin)return;ang+=0.012;draw();raf=requestAnimationFrame(loop)}
  host.querySelector('#el').onchange=e=>{z=+e.target.value;draw()};
  const sb=host.querySelector('#spin');
  sb.onclick=()=>{spin=!spin;sb.textContent=spin?'⏸ 暫停電子':'▶ 轉動電子';if(spin)loop();else cancelAnimationFrame(raf)};
  host.querySelector('#mb').onclick=()=>{cloud=false;host.querySelector('#mb').classList.add('on');host.querySelector('#mc').classList.remove('on');draw()};
  host.querySelector('#mc').onclick=()=>{cloud=true;host.querySelector('#mc').classList.add('on');host.querySelector('#mb').classList.remove('on');draw()};
  draw();loop();
}

        if(m)m.click();
      },60);
    };

}

const MOLECULES={
 '水 H2O':{c:'#0ea5e9',atoms:[['O',0,0,'#dc2626',1.0],['H',-0.76,0.59,'#e2e8f0',0.55],['H',0.76,0.59,'#e2e8f0',0.55]],bonds:[[0,1],[0,2]],note:'彎曲形，鍵角約 104.5°。極性分子，氫鍵令水的沸點異常地高。'},
 '二氧化碳 CO2':{c:'#64748b',atoms:[['C',0,0,'#475569',0.9],['O',-1.16,0,'#dc2626',1.0],['O',1.16,0,'#dc2626',1.0]],bonds:[[0,1,2],[0,2,2]],note:'直線形，鍵角 180°。非極性分子（兩個 C=O 極性互相抵銷）。'},
 '甲烷 CH4':{c:'#16a34a',atoms:[['C',0,0,'#475569',0.9],['H',0.63,0.63,'#e2e8f0',0.5],['H',-0.63,0.63,'#e2e8f0',0.5],['H',-0.63,-0.63,'#e2e8f0',0.5],['H',0.63,-0.63,'#e2e8f0',0.5]],bonds:[[0,1],[0,2],[0,3],[0,4]],note:'正四面體，鍵角 109.5°。非極性分子。'},
 '氨 NH3':{c:'#7c3aed',atoms:[['N',0,0.22,'#2563eb',0.95],['H',-0.94,-0.22,'#e2e8f0',0.5],['H',0.94,-0.22,'#e2e8f0',0.5],['H',0,-1.02,'#e2e8f0',0.5]],bonds:[[0,1],[0,2],[0,3]],note:'三角錐形，鍵角約 107°。極性分子，可形成氫鍵，水溶液呈鹼性。'},
 '氯化氫 HCl':{c:'#d97706',atoms:[['H',-0.9,0,'#e2e8f0',0.5],['Cl',0.55,0,'#16a34a',1.05]],bonds:[[0,1]],note:'直線形雙原子分子。極性共價鍵，溶於水形成鹽酸。'},
 '氯化鈉 NaCl（離子晶體）':{c:'#0891b2',atoms:[['Na+',-1.1,0,'#7c3aed',0.95],['Cl-',1.1,0,'#16a34a',1.05]],bonds:[[0,1]],note:'離子鍵。Na 失去 1 個電子成 Na<sup>+</sup>，Cl 得到 1 個電子成 Cl<sup>−</sup>，靜電吸引形成巨型離子晶格。',ionic:true}

function molView(host){
  host.innerHTML=`
  <div class="ctrlrow">
    <div class="fld"><label>分子</label>
      <select class="sel" id="mv">
        ${Object.keys(MOLECULES).map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}
      </select></div>
    <div class="fld" style="flex:0 0 auto"><label>旋轉</label>
      <button class="btn sm pri" id="rot">⏸ 暫停</button></div>
  </div>
  <div id="cvHost"></div>
  <div class="hint" id="mn"></div>`;
  const cv=mkCanvas(host.querySelector('#cvHost'),900,400),ctx=cv.getContext('2d');
  let name='水 H2O',rot=true,a=0,raf=null;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fbfcfd';ctx.fillRect(0,0,cv.width,cv.height);
    const M=MOLECULES[name];
    const CX=cv.width/2,CY=cv.height/2,SC=88;
    const pts=M.atoms.map(([lbl,x,y,col,r])=>{
      const rx=x*Math.cos(a)-y*Math.sin(a)*0.6;
      const ry=(x*Math.sin(a)+y*Math.cos(a)*0.6)*0.75;
      const z=1+ry*0.06;
      return[CX+rx*SC,CY+ry*SC,r*SC*0.5*z,col,lbl];
    });
    /* 鍵 */
    M.bonds.forEach(([i,j,o])=>{
      ctx.strokeStyle='#94a3b8';ctx.lineWidth=5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[j][0],pts[j][1]);ctx.stroke();
      if(o===2){
        const dx=pts[j][0]-pts[i][0],dy=pts[j][1]-pts[i][1];
        const L=Math.hypot(dx,dy)||1,nx=-dy/L*9,ny=dx/L*9;
        ctx.lineWidth=3.5;
        ctx.beginPath();ctx.moveTo(pts[i][0]+nx,pts[i][1]+ny);ctx.lineTo(pts[j][0]+nx,pts[j][1]+ny);ctx.stroke();
        ctx.beginPath();ctx.moveTo(pts[i][0]-nx,pts[i][1]-ny);ctx.lineTo(pts[j][0]-nx,pts[j][1]-ny);ctx.stroke();
      }
    });
    /* 原子 */
    pts.slice().sort((p,q)=>p[2]-q[2]).forEach(([x,y,r,col,lbl])=>{
      const g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r);
      g.addColorStop(0,'#fff');g.addColorStop(0.35,col);g.addColorStop(1,col);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=Math.abs(r)<30?'#1f2937':'#fff';
      ctx.font='bold '+(r>28?15:11)+'px sans-serif';ctx.textAlign='center';
      ctx.fillText(lbl,x,y+5);ctx.textAlign='left';
    });
    host.querySelector('#mn').innerHTML='<b>'+esc(name)+'</b>　'+esc(M.note);
  }
  function loop(){if(!rot)return;a+=0.008;draw();raf=requestAnimationFrame(loop)}
  host.querySelector('#mv').onchange=e=>{name=e.target.value;draw()};
  const rb=host.querySelector('#rot');
  rb.onclick=()=>{rot=!rot;rb.textContent=rot?'⏸ 暫停':'▶ 旋轉';if(rot)loop();else cancelAnimationFrame(raf)};
  draw();loop();
}

/* ═══════════ 6. 統計計算機 ═══════════ */
function toolStats(host){
  host.innerHTML=`
  <div class="frow"><span class="lbl">輸入數據（以逗號、空格或換行分隔）</span>
    <textarea class="ta" id="sd" rows="4" placeholder="例如：12, 15, 18, 22, 25, 28, 31">12, 15, 18, 22, 25, 28, 31</textarea></div>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn pri" id="scalc">計算</button>
    <button class="btn" id="sdemo">載入範例</button>
  </div>
  <div id="sout"></div>`;
  function calc(){
    const raw=host.querySelector('#sd').value;
    const arr=raw.split(/[,\s;]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));
    if(arr.length<2){host.querySelector('#sout').innerHTML='<div class="empty">請輸入至少兩個數值。</div>';return}
    const a=[...arr].sort((x,y)=>x-y),n=a.length;
    const mean=a.reduce((x,y)=>x+y,0)/n;
    const med=n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;
    const cnt={};a.forEach(v=>cnt[v]=(cnt[v]||0)+1);
    let mode=null,mo=0;
    Object.keys(cnt).forEach(k=>{if(cnt[k]>mo){mo=cnt[k];mode=+k}});
    const range=a[n-1]-a[0];
    const q=p=>{const i=(n-1)*p,lo=Math.floor(i),hi=Math.ceil(i);
      return lo===hi?a[lo]:a[lo]+(a[hi]-a[lo])*(i-lo)};
    const q1=q(0.25),q3=q(0.75),iqr=q3-q1;
    const variance=a.reduce((s,v)=>s+(v-mean)**2,0)/n;
    const sd=Math.sqrt(variance);
    const sdSample=Math.sqrt(a.reduce((s,v)=>s+(v-mean)**2,0)/(n-1));
    host.querySelector('#sout').innerHTML=`
      <div class="readout" style="margin-bottom:14px">
        <div class="ro"><div class="l">個數 n</div><div class="v">${n}</div></div>
        <div class="ro"><div class="l">平均數</div><div class="v">${mean.toFixed(4)}</div></div>
        <div class="ro"><div class="l">中位數</div><div class="v">${med.toFixed(4)}</div></div>
        <div class="ro"><div class="l">眾數</div><div class="v">${mode===null?'—':mode}</div></div>
        <div class="ro"><div class="l">全距</div><div class="v">${range.toFixed(4)}</div></div>
        <div class="ro"><div class="l">Q<sub>1</sub> / Q<sub>3</sub></div><div class="v">${q1.toFixed(2)} / ${q3.toFixed(2)}</div></div>
        <div class="ro"><div class="l">四分位數間距</div><div class="v">${iqr.toFixed(4)}</div></div>
        <div class="ro"><div class="l">標準差（總體）</div><div class="v" style="color:var(--pr)">${sd.toFixed(4)}</div></div>
        <div class="ro"><div class="l">標準差（樣本）</div><div class="v">${sdSample.toFixed(4)}</div></div>
        <div class="ro"><div class="l">變異係數</div><div class="v">${(sd/mean*100).toFixed(2)}%</div></div>
      </div>
      <div class="card" style="padding:16px">
        <div style="font-size:13px;font-weight:700;margin-bottom:11px">箱形圖</div>
        <div id="boxp"></div>
      </div>`;
    const cv=mkCanvas(host.querySelector('#boxp'),860,120),ctx=cv.getContext('2d');
    const lo=Math.min(...a),hi=Math.max(...a);
    const pad=40,W=cv.width-pad*2;
    const X=v=>pad+(v-lo)/(hi-lo||1)*W;
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad,60);ctx.lineTo(cv.width-pad,60);ctx.stroke();
    ctx.fillStyle='#2563eb33';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;
    ctx.fillRect(X(q1),40,X(q3)-X(q1),40);ctx.strokeRect(X(q1),40,X(q3)-X(q1),40);
    ctx.beginPath();ctx.moveTo(X(med),40);ctx.lineTo(X(med),80);ctx.stroke();
    ctx.beginPath();ctx.moveTo(X(lo),60);ctx.lineTo(X(q1),60);ctx.stroke();
    ctx.beginPath();ctx.moveTo(X(q3),60);ctx.lineTo(X(hi),60);ctx.stroke();
    [lo,q1,med,q3,hi].forEach((v,i)=>{
      ctx.beginPath();ctx.moveTo(X(v),i===0||i===4?50:40);ctx.lineTo(X(v),i===0||i===4?70:80);ctx.stroke();
      ctx.fillStyle='#475569';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.fillText(v.toFixed(1),X(v),95);ctx.textAlign='left';
    });
  }
  host.querySelector('#scalc').onclick=calc;
  host.querySelector('#sdemo').onclick=()=>{
    host.querySelector('#sd').value=Array.from({length:24},()=>Math.round(40+Math.random()*60)).join(', ');
    calc();
  };
  calc();
}

    host.querySelector('#pa').textContent=Object.values(DB.pomo).reduce((a,b)=>a+(b.n||0),0);

    left--;
    if(left<=0){
      if(phase==='work'){
        const sid=host.querySelector('#ts').value;

      }else{
        phase='work';left=mins*60;
        beep();alert('休息結束，開始下一個專注時段。');
      }
    }
    draw();
  }
  function beep(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      const ac=new AC(),o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.frequency.value=880;o.type='sine';
      g.gain.setValueAtTime(0.2,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.6);
      o.start();o.stop(ac.currentTime+0.6);
    }catch(e){}
  }
  host.querySelector('#mm').oninput=e=>{mins=+e.target.value;host.querySelector('#mv').textContent=mins;if(phase==='work'&&!run)left=mins*60;draw()};
  host.querySelector('#bb').oninput=e=>{brk=+e.target.value;host.querySelector('#bv').textContent=brk};
  const rb=host.querySelector('#pr');
  rb.onclick=()=>{
    run=!run;
    rb.textContent=run?'⏸':'▶';
    rb.className='rec '+(run?'on':'off');
    if(run)iv=setInterval(tick,1000);else clearInterval(iv);
  };
  draw();
}
/* ════════════════════════════════════════════════════════════
   English Oral 訓練室
   · 模式：AI 小組討論 / P2P 房間碼真連線 / 個人短講
   · 語音識別：瀏覽器 Web Speech API（雙模式，可選填 API Key 升級 AI）
   · AI 發音：Web Speech Synthesis，每個角色獨立音色（voice / pitch / rate）
   · 全過程對話記錄 + 匯出
   · DSE Paper 4 標準評分與改進建議
   ════════════════════════════════════════════════════════════ */

const ORAL={
  mode:null,          // 'group' | 'p2p' | 'indiv'
  q:null,
  log:[],             // {who, name, color, text, t, dur}
  phase:'idle',       // idle | prep | speak | done
  t:0,total:0,iv:null,
  recog:null,recOn:false,buf:'',
  aiBusy:false,
  roles:[],
  peer:null,peerId:null,roomCode:'',calls:{},remoteStreams:{},isHost:false,peers:[]
};

const ORAL_COLORS=['#2563eb','#7c3aed','#059669','#d97706','#db2777','#0891b2'];

/* ── 語音合成 ── */
function voices(){
  try{return window.speechSynthesis?speechSynthesis.getVoices()||[]:[]}catch(e){return[]}
}
function pickVoice(pref){
  const vs=voices();
  if(!vs.length)return null;
  const en=vs.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const pool=en.length?en:vs;
  if(pref==='male-en'){
    return pool.find(v=>/google uk english male|daniel|alex|fred|george|male/i.test(v.name))||pool[0];
  }
  if(pref==='female-en'){
    return pool.find(v=>/google uk english female|samantha|victoria|karen|moira|tessa|female|zira/i.test(v.name))||pool[1]||pool[0];
  }
  if(pref==='male-deep'){
    const m=pool.filter(v=>/male|daniel|alex|fred|george|thomas/i.test(v.name));
    return m[1]||m[0]||pool[0];
  }
  return pool[0];
}
function speak(text,opt={}){
  return new Promise(res=>{
    if(!DB.set.ttsOn||!window.speechSynthesis){res();return}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      const v=pickVoice(opt.voice);
      if(v)u.voice=v;
      u.lang=v?(v.lang||'en-GB'):'en-GB';
      u.pitch=opt.pitch||1;
      u.rate=opt.rate||1;
      u.volume=1;
      u.onend=()=>res();
      u.onerror=()=>res();
      speechSynthesis.speak(u);
      setTimeout(res,Math.min(30000,text.length*90+3000));
    }catch(e){res()}
  });
}
function shutup(){try{speechSynthesis.cancel()}catch(e){}}

/* ── 語音識別 ── */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startRecog(){
  if(!SR){alert('此瀏覽器不支援語音識別。請使用 Chrome、Edge 或 Safari。');return false}
  if(ORAL.recog)return true;
  const r=new SR();
  r.continuous=true;r.interimResults=true;r.lang='en-US';r.maxAlternatives=1;
  r.onresult=e=>{
    let interim='',final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)final+=t+' ';else interim+=t;
    }
    if(final)ORAL.buf+=final;
    const h=$('#oralHint');
    if(h)h.textContent=ORAL.buf?(ORAL.buf+interim).slice(-90):(interim||'聆聽中…');
  };
  r.onerror=e=>{
    if(e.error==='not-allowed'){alert('麥克風權限被拒絕。請在瀏覽器設定中允許麥克風。');stopRecog()}
    if(e.error==='no-speech'){}
  };
  r.onend=()=>{
    if(ORAL.recOn){try{r.start()}catch(e){}}
  };
  try{r.start();ORAL.recog=r;ORAL.recOn=true;return true}
  catch(e){return false}
}
function stopRecog(){
  ORAL.recOn=false;
  if(ORAL.recog){try{ORAL.recog.stop()}catch(e){}ORAL.recog=null}
}

/* ── 開啟 Oral 全屏 ── */

function exitOral(){
  if(ORAL.log.length&&!confirm('離開會結束本次練習（記錄仍可匯出）。確定離開？'))return;
  stopRecog();shutup();clearInterval(ORAL.iv);

  ORAL.peer=null;ORAL.calls={};ORAL.remoteStreams={};ORAL.peers=[];

}

function startOral(){
  ORAL.log=[];ORAL.buf='';ORAL.phase='prep';ORAL.t=0;
  if(!ORAL._preset){
    if(ORAL.mode==='indiv'){
      ORAL.q=ORAL_INDIV[Math.floor(Math.random()*ORAL_INDIV.length)];
      ORAL.total=60;
    }else{
      ORAL.q=ORAL_GROUP[Math.floor(Math.random()*ORAL_GROUP.length)];
      ORAL.total=8*60;
    }
  }else{
    ORAL._preset=false;
  }
  ORAL.roles=AI_ROLES.map((r,i)=>({...r,color:ORAL_COLORS[i],on:true}));
  $('#oralMode').textContent=ORAL.mode==='group'?'AI 小組討論':ORAL.mode==='p2p'?'房間碼連線':'個人短講';
  $('#oralMode').className='badge b '+(ORAL.mode==='indiv'?'ext':ORAL.mode==='p2p'?'elect':'core');
  $('#oralTitle').textContent='English Speaking — '+(ORAL.mode==='indiv'?'Individual Response':'Group Discussion');
  if(ORAL.mode==='p2p'){initP2P();return}
  renderOralQ();renderOralRoles();renderOralLog();setPhase('prep');
  bindOralBtns();
}

function setPhase(p){
  ORAL.phase=p;
  const el=$('#oralPhase');
  const prep=ORAL.mode==='indiv'?60:600;
  clearInterval(ORAL.iv);
  if(p==='prep'){
    ORAL.t=prep;
    el.textContent='準備中 · 可按「跳過準備」直接開始';
    if(ORAL.mode!=='indiv')speak('You have ten minutes to prepare. You may now begin.',{voice:'female-en',pitch:1.05,rate:1});
    ORAL.iv=setInterval(()=>{
      ORAL.t--;tick();
      if(ORAL.t<=0){setPhase('speak')}
    },1000);
  }else if(p==='speak'){
    ORAL.t=ORAL.total;
    el.textContent=ORAL.mode==='indiv'?'個人短講 · 1 分鐘':'小組討論 · 8 分鐘';
    shutup();
    if(ORAL.mode==='group'&&DB.set.autoAI){
      speak('The discussion now begins. You may start speaking.',{voice:'female-en',pitch:1.05,rate:1})
        .then(()=>aiTurn(0));
    }
    ORAL.iv=setInterval(()=>{
      ORAL.t--;tick();
      if(ORAL.t<=0){endOral()}
    },1000);
  }else{el.textContent='已結束'}
  tick();
}
function tick(){
  const e=$('#oralT');if(!e)return;
  e.textContent=fmtClock(ORAL.t);
  e.className='n'+(ORAL.t<=0?' over':ORAL.t<=30?' warn':'');
}
